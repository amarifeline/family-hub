<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Family Hub</title>
<link rel="stylesheet" href="shared/huisstijl.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: var(--gutter);
    gap: clamp(20px, 4vh, 48px);
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 1px solid var(--beige);
    padding-bottom: clamp(12px, 2vh, 24px);
  }
  .naam {
    font-family: var(--script);
    font-size: clamp(56px, 8vw, 104px);
    line-height: 0.9;
    font-weight: normal;
    margin: 0;
  }
  .klok { text-align: right; }
  .tijd {
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(40px, 6vw, 76px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .datum { margin-top: 8px; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(130px, 18vw, 240px), 1fr));
    gap: clamp(14px, 2vw, 24px);
    align-content: start;
  }
  .tegel {
    position: relative;
    background: var(--wit);
    border: 1px solid var(--lijn);
    border-radius: var(--radius);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: inherit;
    text-decoration: none;
    overflow: hidden;
  }
  a.tegel:active { background: var(--room); }
  .tegel svg { width: 58%; height: 58%; stroke: var(--navy); fill: none; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  .tegel.later { opacity: 0.5; }
  .tegel .tlabel { position: absolute; left: 10px; right: 10px; bottom: clamp(12px, 1.6vw, 22px); text-align: center; font-family: var(--sans); font-size: clamp(11px, 0.9vw, 14px); letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); }
  .tegel.met-label svg { width: 50%; height: 50%; margin-bottom: 10%; }
  .tegel .teller { position: absolute; top: clamp(10px, 1.2vw, 18px); right: clamp(10px, 1.2vw, 18px); min-width: clamp(30px, 2.6vw, 40px); height: clamp(30px, 2.6vw, 40px); padding: 0 8px; border-radius: 999px; background: var(--navy); color: var(--wit); font-family: var(--sans); font-weight: 500; font-size: clamp(14px, 1.2vw, 18px); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .tegel .teller[hidden] { display: none; }
  button.tegel { font: inherit; cursor: pointer; padding: 0; }
  button.tegel:active { background: var(--room); }
  .groepkop { display: flex; align-items: center; gap: 18px; margin-bottom: calc(-1 * clamp(8px, 2vh, 24px)); }
  .groepkop h2 { font-family: var(--serif); font-weight: normal; font-size: clamp(28px, 3vw, 40px); margin: 0; }
  .groepkop[hidden] { display: none; }
  .aftellen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: clamp(14px, 1.6vw, 24px); }
  .aftellen[hidden] { display: none; }
  .af { background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); padding: clamp(18px, 2vw, 28px) clamp(20px, 2.4vw, 34px); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .af .wat svg { width: clamp(64px, 6vw, 92px); height: clamp(64px, 6vw, 92px); stroke: var(--navy); fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .af .wanneer { font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--zacht); margin-top: 8px; }
  .af .teller { text-align: right; }
  .af .getal { font-family: var(--sans); font-weight: 300; font-size: clamp(54px, 6vw, 88px); line-height: .9; font-variant-numeric: tabular-nums; }
  .af .eenheid { font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--zacht); margin-top: 6px; }

  footer { display: flex; justify-content: space-between; align-items: center; }
  footer a { color: inherit; text-decoration: none; padding: 12px 0; }

  @media (max-width: 560px) {
    header { flex-direction: column; align-items: flex-start; }
    .klok { text-align: left; }
  }

  /* Tablet in de keuken (Galaxy Tab A8, liggend): het scherm is minder hoog,
     dus kleinere tegels zodat alle apps op één rij passen. */
  @media (orientation: landscape) and (max-height: 900px) and (min-width: 700px) {
    main { grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 14vw, 200px), 1fr)); }
    .naam { font-size: clamp(48px, 6.5vw, 88px); }
    .tijd { font-size: clamp(36px, 5vw, 64px); }
  }
</style>
</head>
<body>
  <header>
    <h1 class="naam">Family Hub</h1>
    <div class="klok">
      <div class="tijd" id="tijd">--:--</div>
      <div class="datum label" id="datum"></div>
    </div>
  </header>

  <div class="groepkop" id="groepkop" hidden><a class="knop" href="#">Terug</a><h2 id="groepnaam"></h2></div>
  <section class="aftellen" id="aftellen" aria-label="Aftellen"></section>
  <main id="tegels"></main>

  <footer>
    <span class="status label" id="status"><i></i><span></span></span>
    <a class="label" href="instellingen/">Instellingen</a>
  </footer>

<script src="shared/config.js"></script>
<script src="shared/hub-db.js"></script>
<script src="shared/kiosk.js"></script>
<script>
  // De apps op het startscherm. Een nieuwe app = één regel erbij.
  // Een tegel met "groep" opent eerst een map met de tegels erin.
  const APPS = [
    { titel: 'Voeding', id: 'voeding', icoon: 'bestek', groep: [
      { titel: "Mila's fruit", href: 'fruit/', icoon: 'appel', label: true },
      { titel: 'Voorraad & boodschappen', href: 'boodschappen/', icoon: 'tas', label: true },
      { titel: 'Weekmenu', href: 'weekmenu/', icoon: 'pot', label: true },
      { titel: 'Recepten', href: 'recepten/', icoon: 'boek', label: true },
    ] },
    { titel: 'Kleding', href: 'kleding/', icoon: 'hanger' },
    { titel: 'Gezinsagenda', href: 'agenda/', icoon: 'agenda' },
    { titel: 'Spaardoelen', href: 'spaardoelen/', icoon: 'euro' },
    { titel: 'Pakjes', href: 'pakjes/', icoon: 'enveloppe', teller: 'pakjes' },
  ];

  const ICONEN = {
    appel: '<path d="M12 7c-2-1.6-6-1.2-6.5 3-.4 3.4 1.6 9 4.5 9 1 0 1.3-.6 2-.6s1 .6 2 .6c2.9 0 4.9-5.6 4.5-9-.5-4.2-4.5-4.6-6.5-3Z"/><path d="M12 7c0-2 1-3.5 3-4"/>',
    hanger: '<path d="M12 7a2 2 0 1 1 2-2"/><path d="M12 7v2L3 16a1.5 1.5 0 0 0 1 2.6h16a1.5 1.5 0 0 0 1-2.6l-9-7"/>',
    tas: '<path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/>',
    pot: '<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-6Z"/><path d="M2 10h20M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"/>',
    boek: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 21a2 2 0 0 1 2-2h13v2H6M9 8h6M9 11h4"/>',
    bestek: '<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M9 3v6"/><path d="M17 21V3c-2 1.2-3 3.6-3 7v3h3"/>',
    euro: '<path d="M17.5 6.2a7 7 0 1 0 0 11.6"/><path d="M4.5 10.2h8.5M4.5 13.8h8.5"/>',
    enveloppe: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.6 6.6 8.4 6.6 8.4-6.6"/>',
    agenda: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  };

  const wrap = document.getElementById('tegels');
  // Aftellen naar vaste dagen (maand 1-12). Na de dag schuift het door naar volgend jaar.
  const AFTELLEN = [
    { wat: 'Sinterklaas', maand: 12, dag: 6, icoon: 'mijter' },
    { wat: 'Kerstmis', maand: 12, dag: 24, icoon: 'boom' },
  ];
  const SYMBOLEN = {
    mijter: '<path d="M6 21h12l-.6-9.5C16.9 7.2 14.8 4.3 12 2.5 9.2 4.3 7.1 7.2 6.6 11.5L6 21Z"/><path d="M12 9v7M9.5 12.5h5M6.4 17.5h11.2"/>',
    boom: '<path d="M12 1.8l.9 1.8 2 .3-1.45 1.4.35 2L12 6.35l-1.8.95.35-2L9.1 3.9l2-.3.9-1.8Z"/><path d="M12 7.5 7 12.5h3L5.5 17h4L4 21h16l-5.5-4h4L14 12.5h3L12 7.5Z"/>',
  };
  function aftellen() {
    const host = document.getElementById('aftellen');
    host.hidden = !!location.hash.slice(1);
    const nu = new Date(), vandaag = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate());
    host.innerHTML = '';
    AFTELLEN.map((a) => {
      let d = new Date(vandaag.getFullYear(), a.maand - 1, a.dag);
      if (d < vandaag) d = new Date(vandaag.getFullYear() + 1, a.maand - 1, a.dag);
      return Object.assign({ d, n: Math.round((d - vandaag) / 864e5) }, a);
    }).forEach((a) => {
      const el = document.createElement('div');
      el.className = 'af';
      el.innerHTML = '<div><div class="wat"></div><div class="wanneer"></div></div><div class="teller"><div class="getal"></div><div class="eenheid"></div></div>';
      el.querySelector('.wat').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + SYMBOLEN[a.icoon] + '</svg>';
      el.setAttribute('aria-label', a.wat);
      el.querySelector('.wanneer').textContent = a.d.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
      el.querySelector('.getal').textContent = a.n === 0 ? '🎉' : a.n;
      el.querySelector('.eenheid').textContent = a.n === 0 ? 'Vandaag!' : a.n === 1 ? 'nachtje slapen' : 'nachtjes slapen';
      host.appendChild(el);
    });
  }
  aftellen();
  window.addEventListener('hashchange', aftellen);
  setInterval(aftellen, 60000);

  function tegels() {
    const id = location.hash.slice(1);
    const groep = APPS.find((a) => a.groep && a.id === id);
    document.getElementById('groepkop').hidden = !groep;
    document.getElementById('groepnaam').textContent = groep ? groep.titel : '';
    wrap.innerHTML = '';
    (groep ? groep.groep : APPS).forEach((a) => {
      const el = document.createElement('a');
      el.className = 'tegel';
      el.href = a.groep ? '#' + a.id : a.href;
      el.setAttribute('aria-label', a.titel);
      el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONEN[a.icoon] + '</svg>';
      if (a.teller) { const t = document.createElement('span'); t.className = 'teller'; t.dataset.teller = a.teller; t.hidden = true; el.appendChild(t); }
      if (a.label) { const l = document.createElement('span'); l.className = 'tlabel'; l.textContent = a.titel; el.appendChild(l); el.classList.add('met-label'); }
      wrap.appendChild(el);
    });
  }
  tegels();
  window.addEventListener('hashchange', () => { tegels(); toonTellers(); });

  // Bolletje op de tegel Pakjes: hoeveel pakjes we nog verwachten (zonder wat we al als ontvangen aantikten).
  const tellers = {};
  function toonTellers() {
    document.querySelectorAll('[data-teller]').forEach((el) => {
      const n = tellers[el.dataset.teller] || 0;
      el.textContent = n; el.hidden = !n;
      el.parentElement.setAttribute('aria-label', el.parentElement.getAttribute('aria-label').replace(/ \(\d+\)$/, '') + (n ? ' (' + n + ')' : ''));
    });
  }
  async function telPakjes() {
    try {
      const [r, v] = await Promise.all([hubDb.rpc('pakjes', {}), hubDb.db.doc('pakjes/verborgen').get()]);
      const weg = (v.exists && v.data().ids) || {};
      tellers.pakjes = r.pakjes.filter((p) => !weg[p.id]).length;
      toonTellers();
    } catch (e) { /* Gmail nog niet gekoppeld of geen verbinding: geen bolletje */ }
  }
  telPakjes();
  setInterval(telPakjes, 15 * 60000);
  // Na 3 minuten niets aanraken terug naar het hoofdscherm.
  let rust;
  function wacht() { clearTimeout(rust); if (location.hash) rust = setTimeout(() => { location.hash = ''; }, 3 * 60000); }
  ['pointerdown', 'keydown'].forEach((t) => document.addEventListener(t, wacht));
  window.addEventListener('hashchange', wacht); wacht();

  // Klok
  const tijd = document.getElementById('tijd');
  const datum = document.getElementById('datum');
  function klok() {
    const nu = new Date();
    tijd.textContent = nu.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
    datum.textContent = nu.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  klok();
  setInterval(klok, 10000);

  // Verbinding
  const STATUS = { ok: 'Verbonden', laden: 'Verbinden…', offline: 'Geen verbinding', sleutel: 'Sleutel klopt niet', proef: 'Proefmodus' };
  const st = document.getElementById('status');
  hubDb.onStatus((s) => { st.dataset.s = s; st.querySelector('span').textContent = STATUS[s] || s; });
  hubDb.ping().catch(() => {});
  setInterval(() => hubDb.ping().catch(() => {}), 60000);

  // 's Morgens een verse pagina (nieuwe versies van de hub worden zo vanzelf opgehaald).
  setInterval(() => { const n = new Date(); if (n.getHours() === 4 && n.getMinutes() === 0) location.reload(); }, 60000);
</script>
</body>
</html>
