<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Boodschappen</title>
<link rel="stylesheet" href="../shared/huisstijl.css">
<style>
/* Overgezet uit het artefact "Boodschappen Gezin". Kleuren en lettertypes komen uit shared/huisstijl.css. */
* { box-sizing: border-box; }
html, body { background: var(--room); color: var(--navy); margin: 0; }
body {
  font-family: var(--sans); font-weight: 300; font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
input, select { -webkit-user-select: text; user-select: text; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--beige); padding-bottom: 16px; }
.links { display: flex; align-items: flex-end; gap: 20px; }
h1 { font-family: var(--script); font-weight: 400; font-size: clamp(44px, 9vw, 68px); line-height: 1; margin: 0; color: var(--navy); }
.teller { font-size: 13px; color: var(--zacht); font-variant-numeric: tabular-nums; }

nav { display: flex; gap: 0; border-bottom: 1px solid var(--lijn); }
nav a { padding: 14px 20px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); text-decoration: none; font-weight: 400; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav a[aria-current="page"] { color: var(--navy); border-bottom-color: var(--navy); }

.status { font-size: 12px; color: var(--zacht); margin: 0; }
section[hidden] { display: none; }

/* Leeg */
.leeg { background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.leeg h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0; }
.leeg p { margin: 0; color: var(--zacht); max-width: 46ch; }
.bknop { background: var(--navy); color: var(--wit); border: 1px solid var(--navy); border-radius: 999px; padding: 12px 22px; min-height: 48px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 400; text-decoration: none; display: inline-flex; align-items: center; }

/* Boodschappenlijst */
.winkels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; align-items: start; }
.winkel { background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; }
.winkel h2 { margin: 0; padding: 14px 16px 12px; font-family: var(--serif); font-weight: 400; font-size: 22px; border-bottom: 1px solid var(--beige); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.winkel h2 small { font-family: var(--sans); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--zacht); font-weight: 400; }
.regel { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--lijn); }
.regel:last-child { border-bottom: 0; }
.regel .naam { min-width: 0; overflow-wrap: anywhere; font-weight: 400; }
.regel .cat { display: block; font-size: 11px; color: var(--zacht); font-weight: 300; }
.aantal { font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
.vink { width: 48px; height: 48px; border: 1px solid var(--navy); background: transparent; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.vink svg { width: 20px; height: 20px; stroke: var(--navy); fill: none; stroke-width: 1.6; }
.vink:active { background: var(--beige); }

/* Vaak gekocht */
.tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.tegel { position: relative; background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; padding: 14px 14px 12px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; text-align: left; width: 100%; }
.tegel:active { background: var(--beige); }
.tegel .naam { font-family: var(--serif); font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
.tegel .winkelnaam { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); font-weight: 400; }
.tegel.aan { border-color: var(--navy); }
.tegelwrap { position: relative; }
.badge { position: absolute; top: 10px; right: 10px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--navy); color: var(--wit); font-size: 12px; font-weight: 500; display: grid; place-items: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.min { position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--lijn); background: var(--wit); display: grid; place-items: center; padding: 0; font-size: 18px; line-height: 1; color: var(--navy); }
.hint { font-size: 12px; color: var(--zacht); margin: 0; }

/* Voorraad */
.nieuw { background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; align-items: end; }
.veld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.veld label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); font-weight: 400; }
input[type=text], input[type=number], select { background: var(--room); border: 1px solid var(--lijn); border-radius: 8px; padding: 10px; min-height: 44px; width: 100%; min-width: 0; font-weight: 400; }
input[type=number] { font-variant-numeric: tabular-nums; }
.vink-veld { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-bottom: 12px; }
.vink-veld input { width: 22px; height: 22px; }
.tabelwrap { background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; padding: 12px 10px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); font-weight: 400; border-bottom: 1px solid var(--beige); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--lijn); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td input, td select { background: transparent; border-color: transparent; padding: 6px; }
td input:focus, td select:focus { background: var(--room); border-color: var(--lijn); }
td.getal input { width: 72px; text-align: center; }
td.koop { text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
td.koop.nul { color: var(--lijn); font-weight: 300; }
.ster { background: transparent; border: 0; padding: 8px; font-size: 22px; line-height: 1; color: var(--lijn); }
.ster[aria-pressed="true"] { color: var(--navy); }
.weg { background: transparent; border: 0; padding: 10px; color: var(--zacht); font-size: 12px; }
tr.actie td { background: #F7F1E6; }
</style>
</head>
<body data-home="../">
<div class="wrap">
  <header>
    <div class="links">
      <a class="knop" href="../#voeding">Terug</a>
      <h1>Boodschappen</h1>
    </div>
    <div class="teller" id="teller" aria-live="polite"></div>
  </header>

  <nav aria-label="Weergave">
    <a href="#boodschappen" data-view="boodschappen">Lijst</a>
    <a href="#vaak" data-view="vaak">Vaak gekocht</a>
    <a href="#voorraad" data-view="voorraad">Voorraad</a>
  </nav>

  <p class="status" id="status" hidden></p>

  <section id="v-boodschappen" hidden>
    <div id="lijst"></div>
  </section>

  <section id="v-vaak" hidden>
    <p class="hint" style="margin-bottom:14px">Tik op een product om het op de lijst te zetten. Tik nog eens voor een extra stuk.</p>
    <div id="tegels"></div>
  </section>

  <section id="v-voorraad" hidden>
    <form class="nieuw" id="nieuw" autocomplete="off">
      <div class="veld"><label for="n-naam">Product</label><input type="text" id="n-naam" required maxlength="80" placeholder="Melk halfvol 1L"></div>
      <div class="veld"><label for="n-cat">Categorie</label><select id="n-cat"></select></div>
      <div class="veld"><label for="n-eenheid">Eenheid</label><select id="n-eenheid"></select></div>
      <div class="veld"><label for="n-voorraad">In huis</label><input type="number" id="n-voorraad" min="0" step="any" value="0"></div>
      <div class="veld"><label for="n-min">Minimum</label><input type="number" id="n-min" min="0" step="any" value="1"></div>
      <div class="veld"><label for="n-winkel">Winkel</label><input type="text" id="n-winkel" list="winkellijst" maxlength="40" placeholder="Delhaize"></div>
      <label class="vink-veld"><input type="checkbox" id="n-vaak"> Vaak gekocht</label>
      <div class="veld"><button type="submit" class="bknop">Toevoegen</button></div>
    </form>
    <datalist id="winkellijst"></datalist>
    <div id="tabel" style="margin-top:20px"></div>
  </section>
</div>

<script src="../shared/config.js"></script>
<script src="../shared/hub-db.js"></script>
<script src="../shared/kiosk.js"></script>
<script>
(function () {
  var CATEGORIEEN = ["Sport en gezondheid","Barbecue","Verse groenten en fruit","Vlees, vis en vegetarische producten","Zuivel, kaas en plantaardige alternatieven","Snel en smakelijk","Apero en voorgerechten","Bakkerij en banket","Zoete kruidenierswaren","Zoute kruidenierswaren","Diepvries","Bewuste voeding","Wijn & bubbels","Koude en warme dranken","Bieren, Alcohol & Alcoholvrij","Onderhoud en huishouden","Keuken, wonen en vrije tijd","Hygiëne en verzorging","Baby","Huisdieren"];
  var EENHEDEN = ["stuks","kg","g","L","ml","pak","fles","rol"];
  var GEEN_WINKEL = "Nog geen winkel";

  var db = null, producten = [], geladen = false, kanSchrijven = true;
  var wachtrij = {}; // per product één schrijfactie tegelijk

  function $(id) { return document.getElementById(id); }
  function esc(s) { var e = document.createElement('span'); e.textContent = s == null ? '' : String(s); return e.innerHTML.replace(/"/g, '&quot;'); }
  function getal(v) { var n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; }
  function fmt(n) { return (Math.round(n * 100) / 100).toString().replace('.', ','); }
  // nodig = wat het weekmenu vraagt; wat je in huis hebt telt daarvoor mee. lijst = extra stuks via "Vaak gekocht".
  function tekopen(p) { return Math.max(0, getal(p.minimum) + getal(p.nodig) - getal(p.voorraad)) + getal(p.lijst); }
  function sorteer(a, b) { return a.naam.localeCompare(b.naam, 'nl'); }

  function zetStatus(t) { var s = $('status'); s.textContent = t || ''; s.hidden = !t; }

  /* ---------- schrijven ---------- */
  function schrijf(id, fn) {
    if (!db) return;
    var vorige = wachtrij[id] || Promise.resolve();
    wachtrij[id] = vorige.then(fn).catch(function (e) {
      zetStatus('Opslaan lukte niet. Probeer het zo nog eens.');
    });
  }
  function bijwerken(id, data) { schrijf(id, function () { return db.doc('producten/' + id).update(data); }); }
  function vind(id) { for (var i = 0; i < producten.length; i++) if (producten[i].id === id) return producten[i]; return null; }

  function lijstPlus(id, d) {
    var p = vind(id); if (!p) return;
    var nieuw = Math.max(0, getal(p.lijst) + d);
    p.lijst = nieuw; render();
    bijwerken(id, { lijst: nieuw });
  }
  function gekocht(id) {
    var p = vind(id); if (!p) return;
    var v = getal(p.voorraad) + tekopen(p);
    p.voorraad = v; p.lijst = 0; p.nodig = 0; render();
    bijwerken(id, { voorraad: v, lijst: 0, nodig: 0 });
  }

  /* ---------- weergave ---------- */
  var VINK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderLijst() {
    var open = producten.filter(function (p) { return tekopen(p) > 0; });
    var host = $('lijst');
    if (!producten.length) {
      host.innerHTML = '<div class="leeg"><h2>Nog geen producten</h2><p>Voeg bij Voorraad je eerste product toe, met de hoeveelheid die je minstens in huis wilt hebben. De lijst vult zich vanzelf zodra er iets onder dat minimum zakt.</p><a class="bknop" href="#voorraad">Naar voorraad</a></div>';
      return;
    }
    if (!open.length) {
      host.innerHTML = '<div class="leeg"><h2>Alles in huis</h2><p>Niets onder het minimum. Tik bij Vaak gekocht op een product om het toch op de lijst te zetten.</p></div>';
      return;
    }
    var groepen = {};
    open.forEach(function (p) { var w = (p.winkel || '').trim() || GEEN_WINKEL; (groepen[w] = groepen[w] || []).push(p); });
    var namen = Object.keys(groepen).sort(function (a, b) {
      if (a === GEEN_WINKEL) return 1; if (b === GEEN_WINKEL) return -1; return a.localeCompare(b, 'nl');
    });
    host.innerHTML = '<div class="winkels">' + namen.map(function (w) {
      var rijen = groepen[w].sort(function (a, b) { return (a.categorie || '').localeCompare(b.categorie || '', 'nl') || sorteer(a, b); });
      return '<article class="winkel"><h2>' + esc(w) + '<small>' + rijen.length + (rijen.length === 1 ? ' product' : ' producten') + '</small></h2>' +
        rijen.map(function (p) {
          return '<div class="regel"><span class="naam">' + esc(p.naam) + (p.categorie ? '<span class="cat">' + esc(p.categorie) + '</span>' : '') + '</span>' +
            '<span class="aantal">' + fmt(tekopen(p)) + ' ' + esc(p.eenheid || '') + '</span>' +
            '<button class="vink" data-gekocht="' + esc(p.id) + '" aria-label="' + esc(p.naam) + ' is gekocht" title="Gekocht">' + VINK + '</button></div>';
        }).join('') + '</article>';
    }).join('') + '</div>';
  }

  function renderTegels() {
    var vaak = producten.filter(function (p) { return p.vaak; }).sort(sorteer);
    var host = $('tegels');
    if (!vaak.length) {
      host.className = '';
      host.innerHTML = '<div class="leeg"><h2>Nog geen vaste producten</h2><p>Zet bij Voorraad een ster bij de producten die je steeds weer koopt. Ze verschijnen hier als tegels om aan te tikken.</p><a class="bknop" href="#voorraad">Naar voorraad</a></div>';
      return;
    }
    host.className = 'tegels';
    host.innerHTML = vaak.map(function (p) {
      var n = getal(p.lijst);
      return '<div class="tegelwrap"><button class="tegel' + (n > 0 ? ' aan' : '') + '" data-plus="' + esc(p.id) + '" aria-label="' + esc(p.naam) + ' toevoegen aan de lijst">' +
        '<span class="naam">' + esc(p.naam) + '</span><span class="winkelnaam">' + esc((p.winkel || '').trim() || '—') + '</span></button>' +
        (n > 0 ? '<span class="badge" aria-hidden="true">' + fmt(n) + '</span><button class="min" data-min="' + esc(p.id) + '" aria-label="Eén minder van ' + esc(p.naam) + '">−</button>' : '') + '</div>';
    }).join('');
  }

  function opties(lijst, huidig, leegTekst) {
    var h = leegTekst ? '<option value="">' + leegTekst + '</option>' : '';
    var heeft = !huidig || lijst.indexOf(huidig) > -1;
    if (!heeft) h += '<option selected>' + esc(huidig) + '</option>';
    return h + lijst.map(function (o) { return '<option' + (o === huidig ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
  }

  function renderTabel() {
    var host = $('tabel');
    var winkels = {};
    producten.forEach(function (p) { if ((p.winkel || '').trim()) winkels[p.winkel.trim()] = 1; });
    $('winkellijst').innerHTML = Object.keys(winkels).sort().map(function (w) { return '<option value="' + esc(w) + '">'; }).join('');
    if (!producten.length) { host.innerHTML = ''; return; }
    var rijen = producten.slice().sort(function (a, b) { return (a.categorie || '').localeCompare(b.categorie || '', 'nl') || sorteer(a, b); });
    host.innerHTML = '<div class="tabelwrap"><table><thead><tr><th>Vaak</th><th>Product</th><th>Categorie</th><th>Eenheid</th><th>In huis</th><th>Minimum</th><th>Weekmenu</th><th>Winkel</th><th>Te kopen</th><th></th></tr></thead><tbody>' +
      rijen.map(function (p) {
        var t = tekopen(p);
        return '<tr data-id="' + esc(p.id) + '"' + (t > 0 ? ' class="actie"' : '') + '>' +
          '<td><button class="ster" data-ster="' + esc(p.id) + '" aria-pressed="' + (p.vaak ? 'true' : 'false') + '" aria-label="Vaak gekocht: ' + esc(p.naam) + '">★</button></td>' +
          '<td><input type="text" data-veld="naam" value="' + esc(p.naam) + '" aria-label="Product" maxlength="80"></td>' +
          '<td><select data-veld="categorie" aria-label="Categorie">' + opties(CATEGORIEEN, p.categorie, 'Kies…') + '</select></td>' +
          '<td><select data-veld="eenheid" aria-label="Eenheid">' + opties(EENHEDEN, p.eenheid) + '</select></td>' +
          '<td class="getal"><input type="number" data-veld="voorraad" min="0" step="any" value="' + getal(p.voorraad) + '" aria-label="In huis"></td>' +
          '<td class="getal"><input type="number" data-veld="minimum" min="0" step="any" value="' + getal(p.minimum) + '" aria-label="Minimum"></td>' +
          '<td class="getal"><input type="number" data-veld="nodig" min="0" step="any" value="' + getal(p.nodig) + '" aria-label="Nodig voor het weekmenu"></td>' +
          '<td><input type="text" data-veld="winkel" list="winkellijst" value="' + esc(p.winkel || '') + '" aria-label="Winkel" maxlength="40"></td>' +
          '<td class="koop' + (t > 0 ? '' : ' nul') + '">' + (t > 0 ? fmt(t) : '–') + '</td>' +
          '<td><button class="weg" data-weg="' + esc(p.id) + '">Verwijder</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  var uitgesteld = false;
  function render() {
    var a = document.activeElement;
    if (a && $('tabel').contains(a) && /INPUT|SELECT/.test(a.tagName)) { uitgesteld = true; renderTeller(); renderLijst(); renderTegels(); return; }
    renderTeller(); renderLijst(); renderTegels(); renderTabel();
  }
  function renderTeller() {
    var n = producten.filter(function (p) { return tekopen(p) > 0; }).length;
    $('teller').textContent = geladen ? (n ? n + (n === 1 ? ' product' : ' producten') + ' te kopen' : 'Niets te kopen') : 'Laden…';
  }
  $('tabel').addEventListener('focusout', function () {
    setTimeout(function () { if (uitgesteld && !$('tabel').contains(document.activeElement)) { uitgesteld = false; render(); } }, 0);
  });

  /* ---------- gebeurtenissen ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.gekocht) gekocht(t.dataset.gekocht);
    else if (t.dataset.plus) lijstPlus(t.dataset.plus, 1);
    else if (t.dataset.min) lijstPlus(t.dataset.min, -1);
    else if (t.dataset.ster) { var p = vind(t.dataset.ster); if (p) { p.vaak = !p.vaak; render(); bijwerken(p.id, { vaak: p.vaak }); } }
    else if (t.dataset.weg) {
      if (t.dataset.sure === '1') { var id = t.dataset.weg; producten = producten.filter(function (x) { return x.id !== id; }); render(); schrijf(id, function () { return db.doc('producten/' + id).delete(); }); }
      else { t.dataset.sure = '1'; t.textContent = 'Zeker?'; setTimeout(function () { if (t.isConnected) { t.dataset.sure = ''; t.textContent = 'Verwijder'; } }, 3000); }
    }
  });
  $('tabel').addEventListener('change', function (e) {
    var el = e.target, tr = el.closest('tr'); if (!tr || !el.dataset.veld) return;
    var p = vind(tr.dataset.id); if (!p) return;
    var v = el.dataset.veld, w = el.value;
    if (v === 'voorraad' || v === 'minimum' || v === 'nodig') w = getal(w);
    else w = String(w).trim();
    if (v === 'naam' && !w) { el.value = p.naam; return; }
    p[v] = w;
    var d = {}; d[v] = w; bijwerken(p.id, d);
    uitgesteld = true; renderTeller(); renderLijst(); renderTegels();
  });
  $('nieuw').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!db) return;
    var naam = $('n-naam').value.trim(); if (!naam) return;
    var doc = { naam: naam, categorie: $('n-cat').value, eenheid: $('n-eenheid').value,
      voorraad: getal($('n-voorraad').value), minimum: getal($('n-min').value),
      winkel: $('n-winkel').value.trim(), vaak: $('n-vaak').checked, lijst: 0 };
    db.collection('producten').add(doc).catch(function () { zetStatus('Opslaan lukte niet. Probeer het zo nog eens.'); });
    $('n-naam').value = ''; $('n-voorraad').value = 0; $('n-vaak').checked = false; $('n-naam').focus();
  });

  /* ---------- navigatie via de hash ---------- */
  var VIEWS = ['boodschappen', 'vaak', 'voorraad'];
  function toon() {
    var v = location.hash.replace('#', ''); if (VIEWS.indexOf(v) < 0) v = 'boodschappen';
    VIEWS.forEach(function (n) { $('v-' + n).hidden = n !== v; });
    document.querySelectorAll('nav a').forEach(function (a) { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  window.addEventListener('hashchange', toon);

  /* ---------- opstarten ---------- */
  $('n-cat').innerHTML = opties(CATEGORIEEN, '', 'Kies…');
  $('n-eenheid').innerHTML = opties(EENHEDEN, 'stuks');
  toon(); render();

  claude.use('db').then(function (d) {
    if (!d) { geladen = true; renderTeller(); zetStatus('De opslag is niet bereikbaar.'); return; }
    db = d;
    var timer = setTimeout(function () { zetStatus('De gegevens zijn nog niet bereikbaar. Wat je ziet is mogelijk niet actueel.'); }, 10000);
    db.collection('producten').onSnapshot(function (snap) {
      producten = snap.docs.map(function (s) { var x = Object.assign({}, s.data() || {}); x.id = s.id; x.naam = x.naam || 'Zonder naam'; return x; });
      geladen = true;
      if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); zetStatus(''); }
      render();
    }, function () { clearTimeout(timer); geladen = true; renderTeller(); zetStatus('De gegevens konden niet geladen worden.'); });
  });
})();
</script>
