<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spaardoelen</title>
<link rel="stylesheet" href="../shared/huisstijl.css">
<style>
  body { padding: var(--gutter); display: flex; flex-direction: column; min-height: 100vh; gap: 22px; }
  input { -webkit-user-select: text; user-select: text; }
  .balk { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .titel { flex: 1; min-width: 200px; }
  .titel h1 { font-family: var(--script); font-weight: normal; font-size: clamp(48px, 6vw, 76px); margin: 0; line-height: 1; }
  .titel .label { margin-top: 18px; }
  [hidden] { display: none !important; }
  .melding { font-family: var(--sans); font-size: 13px; text-align: center; min-height: 18px; color: var(--zacht); }

  /* Spaarvarken */
  .varken { display: block; overflow: visible; }
  .varken .romp { fill: var(--wit); }
  .varken .lijn { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .varken .peil { transition: transform 1.4s cubic-bezier(.3, .7, .3, 1); }
  .varken .golf { animation: golf 6s linear infinite; }
  @keyframes golf { from { transform: translateX(-110px); } to { transform: translateX(0); } }
  .varken .munt { opacity: 0; }
  .varken .munt.valt { animation: valt 0.9s cubic-bezier(.5, 0, .9, .6) forwards; }
  @keyframes valt { 0% { transform: translateY(-70px); opacity: 0; } 15% { opacity: 1; } 80% { transform: translateY(26px); opacity: 1; } 100% { transform: translateY(40px); opacity: 0; } }

  /* Overzicht */
  .doelen { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(170px, 16vw, 230px), 1fr)); gap: clamp(14px, 2vw, 24px); align-content: start; }
  .kaart { background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); padding: clamp(14px, 1.4vw, 20px); display: flex; flex-direction: column; align-items: center; gap: 10px; color: inherit; text-decoration: none; text-align: center; cursor: pointer; font: inherit; }
  .kaart:active { background: var(--room); }
  .kaart .varken { width: 78%; max-width: 170px; margin: 18px 0 2px; }
  .kaart .naam { font-family: var(--serif); font-size: clamp(19px, 1.6vw, 24px); line-height: 1.15; display: flex; align-items: center; gap: 10px; }
  .kaart .naam svg { width: 20px; height: 20px; flex: none; stroke: var(--navy); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .kaart .bedrag { font-family: var(--sans); font-weight: 300; font-size: clamp(22px, 2vw, 28px); font-variant-numeric: tabular-nums; }
  .balkje { width: 100%; height: 8px; border-radius: 99px; background: var(--room); overflow: hidden; }
  .balkje i { display: block; height: 100%; border-radius: 99px; background: var(--navy); transition: width 1.2s ease; }
  .kaart.nieuw { border: 2px dashed var(--beige); background: transparent; justify-content: center; min-height: 180px; color: var(--zacht); }
  .kaart.nieuw .plus { font-family: var(--sans); font-weight: 300; font-size: 48px; line-height: 1; color: var(--beige); }

  /* Eén spaardoel */
  .doel { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.1fr); gap: clamp(20px, 4vw, 56px); align-items: start; max-width: 1300px; width: 100%; margin: 0 auto; }
  .doel .links { background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); padding: clamp(24px, 3vw, 44px); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .doel .links .varken { width: 100%; max-width: 440px; margin-top: 30px; }
  .pct { font-family: var(--sans); font-weight: 300; font-size: clamp(40px, 4vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
  .cijfers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cijfer { background: var(--wit); border: 1px solid var(--lijn); border-radius: 16px; padding: 16px 20px; }
  .cijfer .getal { font-family: var(--sans); font-weight: 300; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .cijfer.groot { grid-column: 1 / -1; }
  .cijfer.groot .getal { font-size: clamp(44px, 4.4vw, 64px); }
  .kop { margin: 26px 0 12px; }
  .snelknoppen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .snelknoppen button { font-family: var(--sans); font-weight: 400; font-size: clamp(22px, 2vw, 28px); color: var(--navy); background: var(--wit); border: 1px solid var(--beige); border-radius: 16px; min-height: 78px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .snelknoppen button:active { background: var(--beige); }
  .snelknoppen .ander { background: var(--navy); color: var(--wit); border-color: var(--navy); font-size: clamp(16px, 1.4vw, 19px); }
  .stortingen { display: flex; flex-direction: column; gap: 6px; }
  .storting { display: flex; align-items: center; gap: 14px; background: var(--wit); border: 1px solid var(--lijn); border-radius: 12px; padding: 6px 8px 6px 18px; min-height: 56px; }
  .storting .wanneer { flex: 1; font-family: var(--sans); font-size: 14px; color: var(--zacht); }
  .storting .b { font-family: var(--sans); font-size: 20px; font-variant-numeric: tabular-nums; }
  .storting .b.min { color: #A5604F; }
  .storting button { font-family: var(--sans); font-size: 13px; color: var(--zacht); background: none; border: 0; min-width: 48px; min-height: 44px; border-radius: 10px; cursor: pointer; }
  .storting button.zeker { background: #A5604F; color: var(--wit); padding: 0 12px; }
  .leeg { font-family: var(--serif); font-size: 20px; color: var(--zacht); }
  .bereikt { font-family: var(--serif); font-size: clamp(24px, 2.2vw, 30px); text-align: center; }

  /* Vensters */
  dialog { border: 0; border-radius: var(--radius); padding: 28px; background: var(--wit); color: var(--navy); width: min(560px, 94vw); max-height: 94vh; }
  dialog::backdrop { background: rgba(44, 62, 82, .35); }
  dialog h2 { font-family: var(--serif); font-weight: normal; font-size: 30px; margin: 0 0 18px; }
  .veld { margin-bottom: 18px; }
  .veld .label { display: block; margin-bottom: 8px; }
  .veld input { font-family: var(--sans); font-size: 17px; color: var(--navy); width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--beige); border-radius: 12px; background: var(--wit); }
  .keuzes { display: flex; gap: 8px; flex-wrap: wrap; }
  .keuzes button { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--lijn); background: var(--room); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .keuzes button svg { width: 28px; height: 28px; stroke: var(--navy); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .keuzes button[aria-pressed="true"] { border: 3px solid var(--navy); }
  .veldknop { font-family: var(--sans); font-size: 17px; color: var(--navy); width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--beige); border-radius: 12px; background: var(--wit); text-align: left; cursor: pointer; }
  .stapper { display: flex; align-items: center; gap: 10px; }
  .stapper .waarde { flex: 1; text-align: center; font-family: var(--sans); font-size: 18px; }
  .rond { width: 52px; padding: 0; justify-content: center; font-size: 22px; }
  .acties { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .acties div { display: flex; gap: 10px; }
  .knop.rood { color: #A5604F; border-color: #E7C9BF; }

  /* Rekenklavier */
  #klavier { width: min(440px, 94vw); }
  .richting { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .richting button { font-family: var(--sans); font-size: 16px; min-height: 50px; border-radius: 999px; border: 1px solid var(--beige); background: var(--wit); color: var(--navy); cursor: pointer; }
  .richting button[aria-pressed="true"] { background: var(--navy); color: var(--wit); border-color: var(--navy); }
  .scherm { font-family: var(--sans); font-weight: 300; font-size: 54px; text-align: right; padding: 8px 14px; border-bottom: 2px solid var(--beige); margin-bottom: 14px; font-variant-numeric: tabular-nums; min-height: 80px; }
  .toetsen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .toetsen button { font-family: var(--sans); font-size: 28px; color: var(--navy); background: var(--room); border: 0; border-radius: 14px; min-height: 70px; cursor: pointer; }
  .toetsen button:active { background: var(--beige); }

  @media (max-width: 820px) { .doel { grid-template-columns: 1fr; } }
</style>
</head>
<body data-home="../" data-terug="5">
  <div class="balk">
    <a class="knop" id="terug" href="../">Terug</a>
    <div class="titel">
      <h1 id="titel">Spaardoelen</h1>
      <div class="label" id="sub"></div>
    </div>
    <button class="knop" id="bewerk" hidden>Bewerken</button>
  </div>

  <main class="doelen" id="overzicht"></main>

  <main class="doel" id="detail" hidden>
    <section class="links">
      <div id="dVarken"></div>
      <div class="pct" id="dPct"></div>
      <div class="balkje" id="dBalk" style="max-width:440px"><i></i></div>
      <div class="bereikt" id="dBereikt" hidden>Doel bereikt! 🎉</div>
    </section>
    <section>
      <div class="cijfers">
        <div class="cijfer groot"><div class="label">Gespaard</div><div class="getal" id="dGespaard"></div></div>
        <div class="cijfer"><div class="label">Doel</div><div class="getal" id="dDoel"></div></div>
        <div class="cijfer"><div class="label">Nog te sparen</div><div class="getal" id="dNog"></div></div>
        <div class="cijfer groot" id="dMaandVak" hidden><div class="label" id="dMaandLabel"></div><div class="getal" id="dMaand"></div></div>
      </div>
      <div class="label kop">Geld in het spaarvarken</div>
      <div class="snelknoppen" id="snel"></div>
      <div class="label kop">Laatste keren</div>
      <div class="stortingen" id="dLijst"></div>
    </section>
  </main>

  <div class="melding" id="melding"></div>

  <!-- Bedrag intikken -->
  <dialog id="klavier">
    <h2 id="kTitel">Ander bedrag</h2>
    <div class="richting" id="kRichting">
      <button type="button" data-r="1" aria-pressed="true">Erbij</button>
      <button type="button" data-r="-1" aria-pressed="false">Eraf</button>
    </div>
    <div class="scherm" id="kScherm">€ 0</div>
    <div class="toetsen" id="kToetsen"></div>
    <div class="acties"><div></div><div><button type="button" class="knop" id="kAnnuleer">Annuleren</button><button type="button" class="knop vol" id="kOk">Opslaan</button></div></div>
  </dialog>

  <!-- Spaardoel maken of aanpassen -->
  <dialog id="dlg">
    <form id="form">
      <h2 id="fKop">Spaardoel</h2>
      <div class="veld"><label class="label" for="fNaam">Naam</label><input id="fNaam" maxlength="40" autocomplete="off" required></div>
      <div class="veld"><span class="label">Doelbedrag</span><button type="button" class="veldknop" id="fDoel"></button></div>
      <div class="veld"><span class="label">Tegen wanneer</span>
        <div class="stapper"><button type="button" class="knop rond" id="fMin" aria-label="Maand eerder">‹</button><div class="waarde" id="fTegen"></div><button type="button" class="knop rond" id="fPlus" aria-label="Maand later">›</button></div>
      </div>
      <div class="veld"><span class="label">Icoon</span><div class="keuzes" id="fIcoon"></div></div>
      <div class="veld"><span class="label">Kleur in het varken</span><div class="keuzes" id="fKleur"></div></div>
      <div class="acties">
        <div><button type="button" class="knop rood" id="fWeg">Verwijderen</button></div>
        <div><button type="button" class="knop" id="fAnnuleer">Annuleren</button><button type="submit" class="knop vol">Opslaan</button></div>
      </div>
    </form>
  </dialog>

<script src="../shared/config.js"></script>
<script src="../shared/hub-db.js"></script>
<script src="../shared/kiosk.js"></script>
<script>
  // Eén document per doel: spaardoelen/<id> = { naam, doel (cent of null), tegen ('JJJJ-MM' of null), icoon, kleur, volgorde, stortingen: [{ id, c (cent, mag negatief), t (ISO) }] }
  const $ = (id) => document.getElementById(id);
  const ICONEN = {
    zon: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
    berg: '<path d="M2.5 19.5 9 8l3.5 6 2.5-4 6.5 9.5Z"/><path d="m7.2 11.2 1.8 1.3 1.6-1.6"/><path d="M17.5 4.5v4M15.5 6.5h4M16.1 5.1l2.8 2.8M18.9 5.1l-2.8 2.8"/>',
    kasteel: '<path d="M4 21V9h3v2h2V9h2v2h2V9h2v2h2V9h3v12Z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4M7 9V5l1.5-1.5L10 5v4M14 9V5l1.5-1.5L17 5v4"/>',
    vliegtuig: '<path d="M10.5 3.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5V9l8 4.5v2l-8-2.5v5l2.5 2v1.5L12 20.5 8 21.5V20l2.5-2v-5l-8 2.5v-2l8-4.5Z"/>',
    huis: '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5M10 20v-5h4v5"/>',
    cadeau: '<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20M12 8.5c-1.5-3-5-4-5-1.5 0 1.5 3 1.5 5 1.5Zm0 0c1.5-3 5-4 5-1.5 0 1.5-3 1.5-5 1.5Z"/>',
    auto: '<path d="M3.5 16.5v-4l2-5h13l2 5v4Z"/><path d="M3.5 12.5h17M7 19.5v-3M17 19.5v-3"/><circle cx="7.5" cy="14.5" r=".5"/><circle cx="16.5" cy="14.5" r=".5"/>',
    ster: '<path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.8Z"/>',
  };
  const KLEUREN = { beige: '#E1CFB9', roze: '#FFD5DC', blauw: '#C7E6FD', groen: '#CFE0C8', zand: '#EBD9A8' };
  // Vaste doelen (bedragen in cent). Verhoog START_VERSIE om ze opnieuw door te voeren;
  // al gespaard geld blijft altijd behouden.
  const START_VERSIE = 2;
  const START = [
    { id: 'zomerreis-2026', naam: 'Zomerreis 2027', doel: 500000, tegen: '2027-07', icoon: 'zon', kleur: 'blauw', volgorde: 1 },
    { id: 'skireis-2028', naam: 'Skireis 2028', doel: 500000, tegen: '2028-02', icoon: 'berg', kleur: 'beige', volgorde: 2 },
    { id: 'disneyland-2028', naam: 'Disneyland 2028', doel: 150000, tegen: null, icoon: 'kasteel', kleur: 'roze', volgorde: 3 },
  ];
  const MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  let db = null, geladen = false, doelen = [];

  /* ---------- hulpjes ---------- */
  function euro(c) {
    const heel = c % 100 === 0;
    return new Intl.NumberFormat('nl-BE', { style: 'currency', currency: 'EUR', minimumFractionDigits: heel ? 0 : 2, maximumFractionDigits: heel ? 0 : 2 }).format(c / 100);
  }
  const som = (d) => (d.stortingen || []).reduce((s, x) => s + (Number(x.c) || 0), 0);
  const pct = (d) => (d.doel ? Math.max(0, som(d) / d.doel * 100) : null);
  const maandTekst = (t) => { if (!t) return 'Geen datum'; const [j, m] = t.split('-').map(Number); return MAANDEN[m - 1] + ' ' + j; };
  function maandenTot(t) {
    if (!t) return null;
    const [j, m] = t.split('-').map(Number), nu = new Date();
    return (j - nu.getFullYear()) * 12 + (m - 1 - nu.getMonth());
  }
  const nieuwId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* ---------- het spaarvarken ---------- */
  let varkenNr = 0;
  function varken(kleur) {
    const n = ++varkenNr, k = KLEUREN[kleur] || KLEUREN.beige;
    let golf = 'M-110 6';
    for (let x = -110; x < 330; x += 55) golf += ' q13.75 -9 27.5 0 t27.5 0';
    golf += ' V220 H-110 Z';
    const vorm = '<ellipse cx="105" cy="92" rx="78" ry="58"/><rect x="166" y="72" width="32" height="40" rx="15"/><path d="M128 44 150 16l10 34Z"/><rect x="56" y="128" width="24" height="33" rx="7"/><rect x="128" y="128" width="24" height="33" rx="7"/>';
    return `<svg class="varken" viewBox="0 0 220 170" aria-hidden="true">
      <defs><clipPath id="vk${n}">${vorm}</clipPath></defs>
      <g fill="#2C3E52" stroke="#2C3E52" stroke-width="6" stroke-linejoin="round">${vorm}</g>
      <g class="romp">${vorm}</g>
      <g clip-path="url(#vk${n})"><g class="peil" style="transform: translateY(165px)"><path class="golf" d="${golf}" fill="${k}"/></g></g>
      <path class="lijn" d="M28 82c-12-6-18 8-8 10 7 1 6-9-1-8"/>
      <circle cx="148" cy="74" r="4.5" fill="#2C3E52"/>
      <ellipse cx="178" cy="92" rx="2.6" ry="4" fill="#2C3E52"/><ellipse cx="187" cy="92" rx="2.6" ry="4" fill="#2C3E52"/>
      <rect x="86" y="37" width="38" height="7" rx="3.5" fill="#2C3E52"/>
      <g class="munt"><circle cx="105" cy="22" r="15" fill="#EBD9A8" stroke="#2C3E52" stroke-width="2.5"/><text x="105" y="28.5" text-anchor="middle" font-family="Poppins, sans-serif" font-size="17" font-weight="500" fill="#2C3E52">€</text></g>
    </svg>`;
  }
  // Peil van 0 % (onderaan de buik) tot 100 % (bovenkant van de rug).
  function zetPeil(svg, p) {
    const v = p === null ? 0 : Math.min(p, 100);
    const y = 152 - (v / 100) * (152 - 32);
    svg.querySelector('.peil').style.transform = `translateY(${v > 0 ? y : 175}px)`;
  }
  function muntErin(svg) {
    const m = svg.querySelector('.munt');
    m.classList.remove('valt'); void m.getBoundingClientRect(); m.classList.add('valt');
  }

  /* ---------- schermen ---------- */
  function huidig() { const id = decodeURIComponent(location.hash.slice(1)); return doelen.find((d) => d.id === id) || null; }

  function teken() {
    const d = huidig();
    $('overzicht').hidden = !!d;
    $('detail').hidden = !d;
    $('bewerk').hidden = !d;
    $('terug').href = d ? '#' : '../';
    if (d) return tekenDetail(d);
    $('titel').textContent = 'Spaardoelen';
    const totaal = doelen.reduce((s, x) => s + som(x), 0);
    $('sub').textContent = geladen ? 'Samen gespaard: ' + euro(totaal) : '';
    const w = $('overzicht');
    w.innerHTML = '';
    doelen.forEach((x) => {
      const a = document.createElement('a');
      a.className = 'kaart'; a.href = '#' + encodeURIComponent(x.id);
      const p = pct(x);
      a.innerHTML = varken(x.kleur) + '<div class="naam"></div>';
      a.querySelector('.naam').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONEN[x.icoon] || ICONEN.ster) + '</svg>';
      a.querySelector('.naam').appendChild(document.createTextNode(x.naam));
      a.setAttribute('aria-label', x.naam + ', ' + euro(som(x)) + ' gespaard');
      w.appendChild(a);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        zetPeil(a.querySelector('.varken'), x.doel ? p : (som(x) > 0 ? 12 : 0));
      }));
    });
    if (geladen) {
      const b = document.createElement('button');
      b.className = 'kaart nieuw'; b.type = 'button';
      b.innerHTML = '<div class="plus">+</div><div class="label">Nieuw spaardoel</div>';
      b.onclick = () => bewerk(null);
      w.appendChild(b);
    }
  }

  let getekend = null; // welk doel staat nu open (voor het muntje)
  function tekenDetail(d, munt) {
    $('titel').textContent = d.naam;
    $('sub').textContent = d.tegen ? 'Tegen ' + maandTekst(d.tegen) : '';
    if (getekend !== d.id || !$('dVarken').firstChild) { $('dVarken').innerHTML = varken(d.kleur); getekend = d.id; }
    const svg = $('dVarken').querySelector('svg');
    svg.querySelector('.golf').setAttribute('fill', KLEUREN[d.kleur] || KLEUREN.beige);
    const g = som(d), p = pct(d);
    if (munt) { muntErin(svg); setTimeout(() => zetPeil(svg, d.doel ? p : (g > 0 ? 12 : 0)), 700); }
    else requestAnimationFrame(() => requestAnimationFrame(() => zetPeil(svg, d.doel ? p : (g > 0 ? 12 : 0))));
    $('dPct').textContent = d.doel ? Math.floor(p) + '%' : '';
    $('dBalk').hidden = !d.doel;
    $('dBalk').querySelector('i').style.width = Math.min(p || 0, 100) + '%';
    $('dBereikt').hidden = !(d.doel && g >= d.doel);
    $('dGespaard').textContent = euro(g);
    $('dDoel').textContent = d.doel ? euro(d.doel) : 'Volgt nog';
    $('dNog').textContent = d.doel ? euro(Math.max(0, d.doel - g)) : '—';
    const m = maandenTot(d.tegen), rest = d.doel ? d.doel - g : 0;
    $('dMaandVak').hidden = !(d.doel && d.tegen && rest > 0);
    if (!$('dMaandVak').hidden) {
      if (m > 0) { $('dMaandLabel').textContent = 'Per maand tot ' + maandTekst(d.tegen); $('dMaand').textContent = euro(Math.ceil(rest / m / 100) * 100); }
      else { $('dMaandLabel').textContent = maandTekst(d.tegen); $('dMaand').textContent = 'Nog ' + euro(rest); }
    }
    // Snelknoppen
    const s = $('snel');
    if (!s.firstChild) {
      [10, 20, 50, 100, 250].forEach((e) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = '+ € ' + e; b.onclick = () => stort(e * 100); s.appendChild(b); });
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ander'; b.textContent = 'Ander bedrag'; b.onclick = () => klavier(); s.appendChild(b);
    }
    // Lijst
    const l = $('dLijst');
    l.innerHTML = '';
    const lijst = (d.stortingen || []).slice().sort((a, b) => (b.t > a.t ? 1 : -1)).slice(0, 8);
    if (!lijst.length) l.innerHTML = '<div class="leeg">Nog niets gespaard. Tik op een bedrag om te beginnen.</div>';
    lijst.forEach((x) => {
      const r = document.createElement('div'); r.className = 'storting';
      const dt = new Date(x.t);
      r.innerHTML = '<span class="wanneer"></span><span class="b"></span><button type="button" aria-label="Wissen">✕</button>';
      r.querySelector('.wanneer').textContent = dt.toLocaleDateString('nl-BE', { weekday: 'short', day: 'numeric', month: 'long', year: dt.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
      const b = r.querySelector('.b'); b.textContent = (x.c < 0 ? '− ' : '+ ') + euro(Math.abs(x.c)); if (x.c < 0) b.classList.add('min');
      const k = r.querySelector('button');
      let t;
      k.onclick = () => {
        if (k.classList.contains('zeker')) { clearTimeout(t); wisStorting(x.id); return; }
        k.classList.add('zeker'); k.textContent = 'Wissen?';
        t = setTimeout(() => { k.classList.remove('zeker'); k.textContent = '✕'; }, 3000);
      };
      l.appendChild(r);
    });
  }

  /* ---------- opslaan ---------- */
  async function bewaar(d) {
    try {
      const { id, ...data } = d;
      await db.doc('spaardoelen/' + id).set(data);
      $('melding').textContent = '';
    } catch (e) { $('melding').textContent = 'Opslaan lukte niet. Probeer het zo nog eens.'; }
  }
  function stort(c) {
    const d = huidig(); if (!d || !db || !c) return;
    d.stortingen = (d.stortingen || []).concat([{ id: nieuwId(), c, t: new Date().toISOString() }]);
    tekenDetail(d, c > 0);
    bewaar(d);
  }
  function wisStorting(sid) {
    const d = huidig(); if (!d) return;
    d.stortingen = (d.stortingen || []).filter((x) => x.id !== sid);
    tekenDetail(d);
    bewaar(d);
  }

  /* ---------- rekenklavier ---------- */
  let kWaarde = '', kRichting = 1, kKlaar = null;
  function kToon() {
    const [e, c] = kWaarde.split(',');
    $('kScherm').textContent = (kRichting < 0 ? '− ' : '') + '€ ' + (e ? Number(e).toLocaleString('nl-BE') : '0') + (c !== undefined ? ',' + c : '');
  }
  function kCent() { if (!kWaarde) return 0; const [e, c = ''] = kWaarde.split(','); return Number(e || 0) * 100 + Number((c + '00').slice(0, 2)); }
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].forEach((t) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
    if (t === '⌫') b.setAttribute('aria-label', 'Wissen');
    b.onclick = () => {
      if (t === '⌫') kWaarde = kWaarde.slice(0, -1);
      else if (t === ',') { if (!kWaarde.includes(',')) kWaarde = (kWaarde || '0') + ','; }
      else {
        const [e, c] = kWaarde.split(',');
        if (c !== undefined ? c.length < 2 : (e || '').length < 6) kWaarde = (kWaarde === '0' ? '' : kWaarde) + t;
      }
      kToon();
    };
    $('kToetsen').appendChild(b);
  });
  $('kRichting').querySelectorAll('button').forEach((b) => b.onclick = () => {
    kRichting = Number(b.dataset.r);
    $('kRichting').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    kToon();
  });
  function klavier(opties = {}) {
    kWaarde = opties.start ? String(opties.start / 100).replace('.', ',') : '';
    kRichting = 1;
    $('kRichting').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.r === '1'));
    $('kRichting').hidden = !!opties.zonderRichting;
    $('kTitel').textContent = opties.titel || 'Ander bedrag';
    kKlaar = opties.klaar || ((c) => stort(c));
    kToon();
    $('klavier').showModal();
  }
  $('kAnnuleer').onclick = () => $('klavier').close();
  $('kOk').onclick = () => { const c = kCent() * kRichting; $('klavier').close(); kKlaar(c); };

  /* ---------- doel maken of aanpassen ---------- */
  let open = null, fDoel = null, fTegen = null, fIcoon = 'ster', fKleur = 'beige';
  function tekenKeuzes() {
    $('fIcoon').innerHTML = ''; $('fKleur').innerHTML = '';
    Object.keys(ICONEN).forEach((k) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', k);
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONEN[k] + '</svg>';
      b.setAttribute('aria-pressed', k === fIcoon); b.onclick = () => { fIcoon = k; tekenKeuzes(); };
      $('fIcoon').appendChild(b);
    });
    Object.keys(KLEUREN).forEach((k) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', k);
      b.style.background = KLEUREN[k];
      b.setAttribute('aria-pressed', k === fKleur); b.onclick = () => { fKleur = k; tekenKeuzes(); };
      $('fKleur').appendChild(b);
    });
    $('fDoel').textContent = fDoel ? euro(fDoel) : 'Nog niet bekend (tik om in te vullen)';
    $('fTegen').textContent = maandTekst(fTegen);
  }
  function bewerk(d) {
    if (!db) return;
    open = d;
    $('fKop').textContent = d ? 'Spaardoel aanpassen' : 'Nieuw spaardoel';
    $('fNaam').value = d ? d.naam : '';
    fDoel = d ? d.doel : null; fTegen = d ? d.tegen : null;
    fIcoon = d ? d.icoon : 'ster'; fKleur = d ? d.kleur : 'beige';
    $('fWeg').hidden = !d;
    tekenKeuzes();
    $('dlg').showModal();
  }
  function schuif(n) {
    const nu = new Date();
    let [j, m] = fTegen ? fTegen.split('-').map(Number) : [nu.getFullYear(), nu.getMonth() + 1];
    if (!fTegen) { fTegen = j + '-' + String(m).padStart(2, '0'); }
    m += n; while (m > 12) { m -= 12; j++; } while (m < 1) { m += 12; j--; }
    const nieuw = j + '-' + String(m).padStart(2, '0');
    const deze = nu.getFullYear() + '-' + String(nu.getMonth() + 1).padStart(2, '0');
    fTegen = nieuw < deze ? null : nieuw;
    tekenKeuzes();
  }
  $('fMin').onclick = () => schuif(-1);
  $('fPlus').onclick = () => schuif(1);
  $('fDoel').onclick = () => klavier({ titel: 'Doelbedrag', start: fDoel, zonderRichting: true, klaar: (c) => { fDoel = c > 0 ? c : null; tekenKeuzes(); } });
  $('fAnnuleer').onclick = () => $('dlg').close();
  $('form').onsubmit = (e) => {
    e.preventDefault();
    const naam = $('fNaam').value.trim(); if (!naam) return;
    const d = open || { id: nieuwId(), stortingen: [], volgorde: doelen.reduce((m, x) => Math.max(m, x.volgorde || 0), 0) + 1 };
    Object.assign(d, { naam, doel: fDoel, tegen: fTegen, icoon: fIcoon, kleur: fKleur });
    if (!open) doelen.push(d);
    $('dlg').close();
    bewaar(d);
    teken();
  };
  let wegKlok;
  $('fWeg').onclick = async () => {
    const b = $('fWeg');
    if (!b.dataset.zeker) { b.dataset.zeker = '1'; b.textContent = 'Zeker? Tik nog eens'; wegKlok = setTimeout(() => { delete b.dataset.zeker; b.textContent = 'Verwijderen'; }, 3000); return; }
    clearTimeout(wegKlok); delete b.dataset.zeker; b.textContent = 'Verwijderen';
    const d = open; $('dlg').close();
    doelen = doelen.filter((x) => x !== d);
    location.hash = '';
    try { await db.doc('spaardoelen/' + d.id).delete(); } catch (e) { $('melding').textContent = 'Verwijderen lukte niet.'; }
  };
  $('dlg').addEventListener('close', () => { clearTimeout(wegKlok); delete $('fWeg').dataset.zeker; $('fWeg').textContent = 'Verwijderen'; });
  $('bewerk').onclick = () => bewerk(huidig());

  /* ---------- laden ---------- */
  window.addEventListener('hashchange', () => { getekend = null; teken(); });
  teken();
  async function klaarzetten() {
    // Zet de vaste doelen in de opslag (eenmalig per START_VERSIE).
    const vlag = await db.doc('instellingen/spaardoelen').get();
    if (vlag.exists && (vlag.data() || {}).versie >= START_VERSIE) return;
    for (const st of START) {
      const { id, ...rest } = st;
      const ref = db.doc('spaardoelen/' + id), oud = await ref.get();
      await ref.set(Object.assign({}, oud.exists ? oud.data() : {}, rest, { stortingen: oud.exists ? (oud.data().stortingen || []) : [] }));
    }
    await db.doc('instellingen/spaardoelen').set({ versie: START_VERSIE, gestart: new Date().toISOString() });
  }

  let stop = null, pogingen = 0;
  function luister() {
    if (stop) stop();
    stop = db.collection('spaardoelen').onSnapshot((snap) => {
      doelen = snap.docs.map((s) => Object.assign({ id: s.id }, JSON.parse(JSON.stringify(s.data() || {}))))
        .sort((a, b) => (a.volgorde || 0) - (b.volgorde || 0));
      if (snap.empty && snap.metadata.fromCache) return; // wacht op de echte gegevens
      geladen = true; $('melding').textContent = '';
      if (!$('dlg').open && !$('klavier').open) teken();
    }, (e) => {
      console.error('spaardoelen:', e);
      // Bv. tabblad nog niet aangemaakt: even later opnieuw proberen.
      if (++pogingen <= 5) setTimeout(luister, 3000);
      else { geladen = true; teken(); $('melding').textContent = 'De spaardoelen konden niet geladen worden.'; }
    });
  }

  claude.use('db').then(async (d) => {
    if (!d) { $('melding').textContent = 'De opslag is niet bereikbaar.'; return; }
    db = d;
    $('melding').textContent = 'Spaardoelen laden…';
    for (let i = 0; i < 3; i++) {
      try { await klaarzetten(); break; } catch (e) { console.error('klaarzetten:', e); await new Promise((r) => setTimeout(r, 2000)); }
    }
    luister();
  });
</script>
</body>
</html>
