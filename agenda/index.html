<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gezinsagenda</title>
<link rel="stylesheet" href="../shared/huisstijl.css">
<style>
  body { padding: var(--gutter); display: flex; flex-direction: column; height: 100vh; gap: 18px; }
  input, select { -webkit-user-select: text; user-select: text; }

  .balk { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .titel { flex: 1; min-width: 200px; }
  .titel h1 { font-family: var(--serif); font-weight: normal; font-size: clamp(28px, 3vw, 40px); margin: 0; line-height: 1.1; }
  .titel .label { margin-top: 4px; }
  .nav { display: flex; gap: 8px; }
  .rond { width: 48px; padding: 0; justify-content: center; font-size: 20px; }

  .legende { display: flex; gap: 18px; flex-wrap: wrap; }
  .legende span { display: inline-flex; align-items: center; gap: 8px; }
  .legende i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

  .week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
  .dag { background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .dag.vandaag { border: 2px solid var(--navy); }
  .dag.voorbij { opacity: .55; }
  .kop { padding: 14px 14px 10px; border-bottom: 1px solid var(--lijn); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font: inherit; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .kop:active { background: var(--room); }
  .kop .nr { font-family: var(--sans); font-weight: 300; font-size: 34px; line-height: 1; }
  .kop .plus { font-family: var(--sans); font-size: 22px; line-height: 1; opacity: .35; }
  .feest { font-family: var(--sans); font-size: 11px; color: var(--zacht); margin-top: 6px; }
  .lijst { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .leeg { font-family: var(--serif); font-size: 15px; color: var(--zacht); padding: 4px 4px; }

  .item { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; color: var(--navy); font: inherit;
          background: var(--wit); border-radius: 10px; padding: 8px 10px 8px 14px; position: relative;
          box-shadow: inset 0 0 0 1px var(--lijn); }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 10px 0 0 10px; background: var(--k); }
  .item.heel { background: var(--kz); box-shadow: none; }
  .item .soort { font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--zacht); margin-right: 6px; }
  .item .uur { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--zacht); }
  .item .tt { font-family: var(--serif); font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }

  .melding { font-family: var(--sans); font-size: 13px; text-align: center; min-height: 18px; color: var(--zacht); }

  dialog { border: 0; border-radius: var(--radius); padding: 28px; background: var(--wit); color: var(--navy); width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(44, 62, 82, .35); }
  dialog h2 { font-family: var(--serif); font-weight: normal; font-size: 30px; margin: 0 0 18px; }
  .veld { margin-bottom: 16px; }
  .veld .label { display: block; margin-bottom: 8px; }
  .veld input { font-family: var(--sans); font-size: 16px; color: var(--navy); width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid var(--beige); border-radius: 12px; background: var(--wit); }
  .wie { display: flex; gap: 8px; flex-wrap: wrap; }
  .wie button { display: inline-flex; align-items: center; gap: 8px; }
  .wie button i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .wie button[aria-pressed="true"] { border: 2px solid var(--navy); }
  .uren { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .acties { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .detail p { font-family: var(--serif); font-size: 19px; margin: 0 0 10px; }

  .wissel { display: flex; border: 1px solid var(--beige); border-radius: 999px; padding: 3px; background: var(--wit); }
  .wissel button { border: 0; background: transparent; color: var(--navy); font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; min-height: 42px; padding: 0 18px; cursor: pointer; }
  .wissel button[aria-pressed="true"] { background: var(--navy); color: var(--wit); }

  /* Dagweergave: een kolom per persoon */
  .dagview { --g: 64px; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); overflow: hidden; }
  .dv-rij { display: grid; grid-template-columns: var(--g) repeat(var(--n), minmax(0, 1fr)); }
  .dv-kop { border-bottom: 1px solid var(--lijn); padding: 14px 0 12px; }
  .persoon { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .avatar.foto { background-size: cover; background-position: center; color: transparent !important; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--script); font-size: 30px; line-height: 1; padding-top: 4px; }
  .persoon .label { color: var(--navy); }
  .dv-heel { border-bottom: 1px solid var(--lijn); }
  .dv-heel > div { padding: 6px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid var(--lijn); min-height: 12px; }
  .dv-heel .gutter, .dv-kop .gutter { border-left: 0; font-family: var(--sans); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--zacht); display: flex; align-items: center; justify-content: center; text-align: center; }
  .chip { border: 0; border-radius: 8px; padding: 6px 8px; text-align: left; font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; background: var(--k); color: var(--t); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-scroll { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
  .dv-raster { position: relative; }
  .dv-uur { position: absolute; left: 0; right: 0; border-top: 1px solid var(--lijn); }
  .dv-uur span { position: absolute; left: 0; width: 56px; top: -9px; text-align: right; font-family: var(--sans); font-size: 12px; color: var(--zacht); background: var(--wit); padding-right: 4px; }
  .dv-uur:first-child span { top: 2px; }
  .dv-kol { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--lijn); cursor: pointer; }
  .blok { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; border: 0; border-radius: 10px; padding: 6px 8px; text-align: left; cursor: pointer; overflow: hidden; background: var(--k); color: var(--t); box-shadow: 0 0 0 2px var(--wit); font: inherit; }
  .blok .tt { font-family: var(--sans); font-size: 14px; font-weight: 500; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; }
  .blok .uur { font-family: var(--sans); font-size: 12px; opacity: .85; margin-top: 2px; }
  .wkdag .datumrond { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--sans); font-weight: 300; font-size: 26px; color: var(--navy); }
  .wkdag.nu .datumrond { background: var(--navy); color: var(--wit); }
  .wkdag.voorbij { opacity: .5; }
  .wkdag .feestje { font-family: var(--sans); font-size: 10px; color: var(--zacht); text-align: center; padding: 0 4px; line-height: 1.2; }
  .wk-rijen { display: flex; flex-direction: column; }
  .wk-rij { border-bottom: 1px solid var(--lijn); flex: 1 0 92px; }
  .wk-rij:last-child { border-bottom: 0; }
  .wk-rij.nu { background: rgba(225, 207, 185, .22); }
  .wk-rij.voorbij .wk-dag, .wk-rij.voorbij .wk-cel { opacity: .55; }
  .wk-dag { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 2px; }
  .wk-dag .datumrond { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--sans); font-weight: 300; font-size: 22px; color: var(--navy); }
  .wk-rij.nu .datumrond { background: var(--navy); color: var(--wit); }
  .wk-dag .feestje { font-family: var(--sans); font-size: 9px; color: var(--zacht); text-align: center; line-height: 1.2; }
  .wk-cel { border-left: 1px solid var(--lijn); padding: 6px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; min-width: 0; }
  .wk-item { white-space: normal; display: flex; flex-direction: column; gap: 1px; padding: 6px 9px; }
  .wk-item .wk-uur { font-size: 11px; font-weight: 400; opacity: .85; }
  .wk-item .wk-tt { font-size: 13px; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }
  .dv-kol.vandaag { background: rgba(225, 207, 185, .18); }
  .nulijn { position: absolute; left: 60px; right: 0; height: 2px; background: #C9483B; z-index: 3; pointer-events: none; }
  .nulijn::before { content: attr(data-t); position: absolute; left: -58px; top: -10px; background: #C9483B; color: #fff; font-family: var(--sans); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 6px; }
  [hidden] { display: none !important; }

  @media (max-width: 900px) {
    body { height: auto; }
    .week { grid-template-columns: 1fr; }
    .dagview { flex: none; height: 80vh; }
    .dagview { --g: 44px; }
    .wk-dag .datumrond { width: 32px; height: 32px; font-size: 16px; } .wk-item { padding: 4px 5px; } .wk-item .wk-uur { display: none; } .wk-item .wk-tt { font-size: 11px; }
    .blok { padding: 4px; } .blok .tt { font-size: 12px; overflow-wrap: normal; } .blok .uur { display: none; }
    .dv-uur span { width: 40px; font-size: 11px; }
    .nulijn { left: 40px; } .nulijn::before { display: none; }
    .avatar { width: 36px; height: 36px; font-size: 20px; }
    .lijst { overflow: visible; }
  }
</style>
</head>
<body data-home="../" data-terug="10">
  <div class="balk">
    <a class="knop" href="../">Terug</a>
    <div class="titel">
      <h1>Gezinsagenda</h1>
      <div class="label" id="weeklabel"></div>
    </div>
    <div class="wissel" role="group" aria-label="Weergave">
      <button type="button" id="wDag" aria-pressed="true">Dag</button>
      <button type="button" id="wWeek" aria-pressed="false">Week</button>
    </div>
    <div class="nav">
      <button class="knop rond" id="vorige" aria-label="Vorige">‹</button>
      <button class="knop" id="nu">Vandaag</button>
      <button class="knop rond" id="volgende" aria-label="Volgende">›</button>
    </div>
    <button class="knop vol" id="nieuw">+ Afspraak</button>
  </div>

  <div class="legende label" id="legende"></div>
  <main class="week" id="week" hidden></main>
  <main class="dagview" id="dagview"></main>
  <div class="melding" id="melding"></div>

  <dialog id="dlgNieuw">
    <form method="dialog" id="formNieuw">
      <h2>Nieuwe afspraak</h2>
      <div class="veld"><span class="label">Voor wie</span><div class="wie" id="wie"></div></div>
      <div class="veld"><label class="label" for="fTitel">Wat</label><input id="fTitel" autocomplete="off" maxlength="200" required></div>
      <div class="veld"><label class="label" for="fDatum">Wanneer</label><input id="fDatum" type="date" required></div>
      <div class="veld">
        <div class="wie">
          <button type="button" class="knop" id="fHeel" aria-pressed="false">Hele dag</button>
        </div>
      </div>
      <div class="veld uren" id="fUren">
        <div><label class="label" for="fVan">Van</label><input id="fVan" type="time" value="09:00"></div>
        <div><label class="label" for="fTot">Tot</label><input id="fTot" type="time" value="10:00"></div>
      </div>
      <div class="veld"><label class="label" for="fWaar">Waar (mag leeg)</label><input id="fWaar" autocomplete="off" maxlength="200"></div>
      <div class="melding" id="fMelding"></div>
      <div class="acties">
        <button type="button" class="knop" id="fAnnuleer">Annuleren</button>
        <button type="submit" class="knop vol" id="fBewaar">Opslaan</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgDetail">
    <div class="detail">
      <div class="label" id="dWie"></div>
      <h2 id="dTitel"></h2>
      <p id="dWanneer"></p>
      <p id="dWaar"></p>
      <div class="acties"><button class="knop vol" id="dSluit">Sluiten</button></div>
    </div>
  </dialog>

<script src="../shared/config.js"></script>
<script src="../shared/hub-db.js"></script>
<script src="../shared/kiosk.js"></script>
<script>
  // Kleuren uit de familie-huisstijl.
  const MENSEN = {
    feline: { naam: 'Féline', kleur: '#B29B89' },
    aaron:  { naam: 'Aaron',  kleur: '#2B5374' },
    mila:   { naam: 'Mila',   kleur: '#FFD5DC' },
    finn:   { naam: 'Finn',   kleur: '#C7E6FD' },
    gezin:  { naam: 'Gezin',  kleur: '#8F9EAA' },
  };
  const CATEGORIE = { '6': '#D98B3F', '5': '#D9B23F' }; // mandarijn = verjaardag, banaan = events & feesten
  const DAGNAMEN = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const plusDagen = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function maandagVan(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function tint(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

  let maandag = maandagVan(new Date());
  let dagSel = new Date(); dagSel.setHours(12, 0, 0, 0);
  let modus = 'dag';
  try { modus = localStorage.getItem('hub.agenda.modus') || 'dag'; } catch (e) {}
  const KOLOMMEN = ['feline', 'aaron', 'mila', 'finn', 'gezin'];
  function tekstOp(hex) { const n = parseInt(hex.slice(1), 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#2C3E52' : '#FFFFFF'; }
  // Foto's per persoon (ingesteld via Instellingen)
  let FOTOS = {};
  try { FOTOS = JSON.parse(localStorage.getItem('hub.personen') || '{}'); } catch (e) {}
  claude.use('db').then((db) => {
    if (!db) return;
    db.collection('personen').onSnapshot((snap) => {
      const n = {}; snap.docs.forEach((d) => { const f = (d.data() || {}).foto; if (typeof f === 'string' && f.startsWith('data:image/')) n[d.id] = f; });
      if (JSON.stringify(n) === JSON.stringify(FOTOS)) return;
      FOTOS = n; try { localStorage.setItem('hub.personen', JSON.stringify(n)); } catch (e) {}
      if (modus === 'dag') teken();
    }, () => {});
  });
  const minVan = (t) => +t.slice(11, 13) * 60 + +t.slice(14, 16);
  let events = [];
  let laadNr = 0;

  // Legende
  $('legende').innerHTML = Object.values(MENSEN).map((m) => `<span><i style="background:${m.kleur}"></i>${m.naam}</span>`).join('') +
    `<span><i style="background:${CATEGORIE['6']}"></i>Verjaardag</span><span><i style="background:${CATEGORIE['5']}"></i>Events &amp; feesten</span><span><i style="background:#4F86A8"></i>Taken</span>`;

  // Zelfde regels als de weekkaarten. Let op: in Féline's eigen agenda komt haar blauwe taakkleur door als colorId 5
  // (elders is 5 banaan = events & feesten).
  function soortVan(ev) {
    const t = (ev.titel || '').trim();
    if (ev.kleur === '6' || /^verjaardag/i.test(t)) return 'verjaardag';
    if (ev.kleur === '5') return ev.kal === 'feline' ? 'taak' : 'feest';
    if (ev.kleur === '10' || /^vrij$/i.test(t)) return 'vrij';
    if (ev.kleur === '7' || /^to ?do/i.test(t)) return 'taak';
    return 'afspraak';
  }
  const TAAKKLEUR = '#4F86A8'; // rustig blauw (pauw) voor taken
  const SOORTKLEUR = { verjaardag: CATEGORIE['6'], feest: CATEGORIE['5'], taak: TAAKKLEUR };
  const SOORTLABEL = { vrij: 'Vrij' };
  function kleurVan(ev) { return SOORTKLEUR[soortVan(ev)] || (MENSEN[ev.kal] || MENSEN.gezin).kleur; }

  function cacheSleutel() { return 'hub.agenda.' + iso(maandag); }

  async function laad() {
    const nr = ++laadNr;
    const van = iso(maandag), tot = iso(plusDagen(maandag, 7));
    try {
      const c = JSON.parse(localStorage.getItem(cacheSleutel()) || 'null');
      if (c) { events = c; teken(); }
    } catch (e) { /* geen cache */ }
    try {
      const res = await hubDb.rpc('agenda', { van, tot });
      if (nr !== laadNr) return; // ondertussen naar een andere week gegaan
      events = res.events || [];
      try { localStorage.setItem(cacheSleutel(), JSON.stringify(events)); } catch (e) {}
      $('melding').textContent = '';
      teken();
    } catch (e) {
      if (nr !== laadNr) return;
      $('melding').textContent = e.code === 'not_granted'
        ? 'De sleutel ontbreekt op dit scherm. Vul hem in bij Instellingen.'
        : 'De agenda is nu niet bereikbaar. Wat je ziet, kan verouderd zijn.';
      teken();
    }
  }

  function opDag(ev, dag) {
    if (ev.heleDag) return ev.start <= dag && dag < ev.einde;
    return ev.start.slice(0, 10) === dag;
  }

  function teken() {
    $('week').hidden = true;
    $('dagview').hidden = false;
    $('wDag').setAttribute('aria-pressed', modus === 'dag');
    $('wWeek').setAttribute('aria-pressed', modus === 'week');
    if (modus === 'dag') tekenDag(); else tekenWeek();
  }

  const UURHOOGTE = 64;
  let eersteKeer = true;
  // Een tijdsraster met kolommen: personen (dag) of dagen (week).
  function dagFilter(dag) {
    return (ev) => ev.heleDag ? opDag(ev, dag) : (ev.start.slice(0, 10) <= dag && ev.einde.slice(0, 10) >= dag && !(ev.einde.slice(0, 10) === dag && ev.einde.slice(11) === '00:00'));
  }
  function tekenRaster(kols) {
    const vandaag = iso(new Date()), v = $('dagview');
    const beginOp = (dag) => (ev) => ev.start.slice(0, 10) < dag ? 0 : minVan(ev.start);
    const eindeOp = (dag) => (ev) => ev.einde.slice(0, 10) > dag ? 1440 : Math.max(minVan(ev.einde), beginOp(dag)(ev) + 15);
    kols.forEach((k) => {
      k.items = events.filter((ev) => ev.kal !== 'feestdagen' && dagFilter(k.dag)(ev) && k.van(ev));
      k.begin = beginOp(k.dag); k.einde = eindeOp(k.dag);
    });
    let vanU = 7, totU = 22;
    kols.forEach((k) => k.items.filter((ev) => !ev.heleDag).forEach((ev) => { vanU = Math.min(vanU, Math.floor(k.begin(ev) / 60)); totU = Math.max(totU, Math.ceil(k.einde(ev) / 60)); }));
    totU = Math.min(totU, 24);

    v.style.setProperty('--n', kols.length);
    v.innerHTML = `<div class="dv-rij dv-kop"><div class="gutter"></div>${kols.map((k) => k.kop).join('')}</div>
      <div class="dv-rij dv-heel"><div class="gutter">Hele dag</div>${kols.map((k, i) => `<div data-heel="${i}"></div>`).join('')}</div>
      <div class="dv-scroll"><div class="dv-raster" style="height:${(totU - vanU) * UURHOOGTE + 8}px"></div></div>`;
    kols.forEach((k, i) => {
      const host = v.querySelector(`[data-heel="${i}"]`);
      k.items.filter((ev) => ev.heleDag).forEach((ev) => {
        const kl = kleurVan(ev), b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.style.setProperty('--k', kl); b.style.setProperty('--t', tekstOp(kl));
        b.textContent = ev.titel || '(zonder titel)';
        b.onclick = () => toonDetail(ev);
        host.appendChild(b);
      });
    });

    const raster = v.querySelector('.dv-raster');
    for (let u = vanU; u <= totU; u++) {
      const l = document.createElement('div'); l.className = 'dv-uur'; l.style.top = ((u - vanU) * UURHOOGTE) + 'px';
      if (u < totU) l.innerHTML = `<span>${pad(u)}:00</span>`;
      raster.appendChild(l);
    }
    const breedte = `calc((100% - var(--g)) / ${kols.length})`;
    kols.forEach((k, i) => {
      const kol = document.createElement('div');
      kol.className = 'dv-kol' + (k.isDag && k.dag === vandaag ? ' vandaag' : '');
      kol.style.left = `calc(var(--g) + ${breedte} * ${i})`; kol.style.width = breedte;
      kol.onclick = (e) => {
        if (e.target !== kol) return;
        const u = Math.min(23, vanU + Math.floor(e.offsetY / UURHOOGTE));
        openNieuw(k.dag, k.wie, pad(u) + ':00', pad(Math.min(23, u + 1)) + ':00');
      };
      // Overlappende afspraken naast elkaar zetten
      const mijn = k.items.filter((ev) => !ev.heleDag).sort((a, b) => k.begin(a) - k.begin(b) || k.einde(b) - k.einde(a));
      const sporen = [], groepen = []; let groep = null, groepEinde = -1;
      mijn.forEach((ev) => {
        if (k.begin(ev) >= groepEinde) { groep = []; groepen.push(groep); sporen.length = 0; }
        let sp = sporen.findIndex((e) => e <= k.begin(ev)); if (sp < 0) { sp = sporen.length; sporen.push(0); }
        sporen[sp] = k.einde(ev); ev._spoor = sp; groep.push(ev); groepEinde = Math.max(groepEinde, k.einde(ev));
        groep.n = Math.max(groep.n || 0, sporen.length);
      });
      groepen.forEach((g) => g.forEach((ev) => {
        const kl = kleurVan(ev), b = document.createElement('button');
        b.type = 'button'; b.className = 'blok';
        const top = (k.begin(ev) - vanU * 60) / 60 * UURHOOGTE, h = (k.einde(ev) - k.begin(ev)) / 60 * UURHOOGTE;
        b.style.top = top + 2 + 'px'; b.style.height = Math.max(22, h - 4) + 'px';
        b.style.left = `calc(${100 / g.n * ev._spoor}% + 4px)`; b.style.width = `calc(${100 / g.n}% - 8px)`;
        b.style.setProperty('--k', kl); b.style.setProperty('--t', tekstOp(kl));
        b.innerHTML = '<div class="tt"></div>' + (h >= 44 ? '<div class="uur"></div>' : '');
        b.querySelector('.tt').textContent = ev.titel || '(zonder titel)';
        if (h >= 44) b.querySelector('.uur').textContent = ev.start.slice(11) + ' – ' + ev.einde.slice(11);
        b.onclick = () => toonDetail(ev);
        kol.appendChild(b);
      }));
      raster.appendChild(kol);
    });

    const scroll = v.querySelector('.dv-scroll');
    const metVandaag = kols.some((k) => k.dag === vandaag);
    const nu = new Date(), m = nu.getHours() * 60 + nu.getMinutes();
    if (metVandaag && m >= vanU * 60 && m <= totU * 60) {
      const lijn = document.createElement('div'); lijn.className = 'nulijn';
      lijn.style.top = ((m - vanU * 60) / 60 * UURHOOGTE) + 'px'; lijn.dataset.t = pad(nu.getHours()) + ':' + pad(nu.getMinutes());
      raster.appendChild(lijn);
      if (eersteKeer) scroll.scrollTop = Math.max(0, (m - vanU * 60) / 60 * UURHOOGTE - 120);
    } else if (eersteKeer) {
      const alle = kols.flatMap((k) => k.items.filter((ev) => !ev.heleDag).map(k.begin));
      const eerste = alle.length ? Math.min(...alle) : 8 * 60;
      scroll.scrollTop = Math.max(0, (eerste - vanU * 60) / 60 * UURHOOGTE - 20);
    }
    eersteKeer = false;
  }

  function tekenDag() {
    const dag = iso(dagSel), vandaag = iso(new Date());
    const feest = events.filter((ev) => ev.kal === 'feestdagen' && opDag(ev, dag)).map((ev) => ev.titel);
    let label = dagSel.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
    label = label.charAt(0).toUpperCase() + label.slice(1);
    $('weeklabel').textContent = label + (dag === vandaag ? ' · vandaag' : '') + (feest.length ? ' · ' + feest.join(' · ') : '');
    tekenRaster(KOLOMMEN.map((k) => {
      const m = MENSEN[k], f = FOTOS[k];
      return {
        dag, wie: k, van: (ev) => (MENSEN[ev.kal] ? ev.kal : 'gezin') === k,
        kop: `<div class="persoon"><div class="avatar${f ? ' foto' : ''}" style="background-color:${m.kleur};color:${tekstOp(m.kleur)};${f ? `background-image:url('${f}');box-shadow:0 0 0 3px ${m.kleur}` : ''}">${m.naam.charAt(0)}</div><div class="label">${m.naam}</div></div>`,
      };
    }));
  }

  // Week: een rij per dag, een kolom per persoon (zelfde kop als de dagweergave).
  function kopPersonen() {
    return KOLOMMEN.map((k) => {
      const m = MENSEN[k], f = FOTOS[k];
      return `<div class="persoon"><div class="avatar${f ? ' foto' : ''}" style="background-color:${m.kleur};color:${tekstOp(m.kleur)};${f ? `background-image:url('${f}');box-shadow:0 0 0 3px ${m.kleur}` : ''}">${m.naam.charAt(0)}</div><div class="label">${m.naam}</div></div>`;
    }).join('');
  }
  function tekenWeek() {
    const vandaag = iso(new Date()), zondag = plusDagen(maandag, 6);
    const fmt = (d, o) => d.toLocaleDateString('nl-BE', o);
    $('weeklabel').textContent = maandag.getMonth() === zondag.getMonth()
      ? `${maandag.getDate()} – ${fmt(zondag, { day: 'numeric', month: 'long' })}`
      : `${fmt(maandag, { day: 'numeric', month: 'long' })} – ${fmt(zondag, { day: 'numeric', month: 'long' })}`;
    const v = $('dagview');
    v.style.setProperty('--n', KOLOMMEN.length);
    v.innerHTML = `<div class="dv-rij dv-kop wk-kop"><div class="gutter"></div>${kopPersonen()}</div><div class="dv-scroll wk-rijen"></div>`;
    const host = v.querySelector('.wk-rijen');
    let vandaagRij = null;
    for (let i = 0; i < 7; i++) {
      const d = plusDagen(maandag, i), dag = iso(d);
      const vanDag = events.filter(dagFilter(dag));
      const feest = vanDag.filter((ev) => ev.kal === 'feestdagen').map((ev) => ev.titel).join(' · ');
      const rij = document.createElement('div');
      rij.className = 'dv-rij wk-rij' + (dag === vandaag ? ' nu' : '') + (dag < vandaag ? ' voorbij' : '');
      rij.innerHTML = `<div class="wk-dag"><div class="label">${DAGNAMEN[i].slice(0, 2)}</div><div class="datumrond">${d.getDate()}</div><div class="feestje"></div></div>` +
        KOLOMMEN.map((k) => `<div class="wk-cel" data-k="${k}"></div>`).join('');
      rij.querySelector('.feestje').textContent = feest;
      KOLOMMEN.forEach((k) => {
        const cel = rij.querySelector(`[data-k="${k}"]`);
        cel.onclick = (e) => { if (e.target === cel) openNieuw(dag, k); };
        vanDag.filter((ev) => ev.kal !== 'feestdagen' && (MENSEN[ev.kal] ? ev.kal : 'gezin') === k)
          .sort((a, b) => (b.heleDag - a.heleDag) || (a.heleDag ? 0 : a.start.localeCompare(b.start)) || a.titel.localeCompare(b.titel))
          .forEach((ev) => {
            const kl = kleurVan(ev), b = document.createElement('button');
            b.type = 'button'; b.className = 'chip wk-item';
            b.style.setProperty('--k', kl); b.style.setProperty('--t', tekstOp(kl));
            b.innerHTML = (ev.heleDag ? '' : '<span class="wk-uur"></span>') + '<span class="wk-tt"></span>';
            if (!ev.heleDag) b.querySelector('.wk-uur').textContent = (ev.start.slice(0, 10) < dag ? '00:00' : ev.start.slice(11)) + ' – ' + (ev.einde.slice(0, 10) > dag ? '24:00' : ev.einde.slice(11));
            b.querySelector('.wk-tt').textContent = ev.titel || '(zonder titel)';
            b.onclick = () => toonDetail(ev);
            cel.appendChild(b);
          });
      });
      if (dag === vandaag) vandaagRij = rij;
      host.appendChild(rij);
    }
    if (eersteKeer && vandaagRij) host.scrollTop = Math.max(0, vandaagRij.offsetTop - host.offsetTop - 8);
    eersteKeer = false;
  }

  // Detail
  function toonDetail(ev) {
    $('dWie').textContent = (MENSEN[ev.kal] || { naam: '' }).naam;
    $('dTitel').textContent = ev.titel || '(zonder titel)';
    const d = new Date(ev.start.slice(0, 10) + 'T12:00');
    let wanneer = d.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
    if (ev.heleDag) {
      const laatste = plusDagen(new Date(ev.einde + 'T12:00'), -1);
      if (iso(laatste) !== ev.start) wanneer += ' tot ' + laatste.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
      else wanneer += ', hele dag';
    } else {
      wanneer += ', ' + ev.start.slice(11) + ' – ' + ev.einde.slice(11);
    }
    $('dWanneer').textContent = wanneer;
    $('dWaar').textContent = ev.locatie || '';
    $('dlgDetail').showModal();
  }
  $('dSluit').onclick = () => $('dlgDetail').close();

  // Nieuwe afspraak
  let wie = 'gezin', heleDag = false;
  $('wie').innerHTML = Object.entries(MENSEN).map(([k, m]) =>
    `<button type="button" class="knop" data-wie="${k}" aria-pressed="false"><i style="background:${m.kleur}"></i>${m.naam}</button>`).join('');
  $('wie').onclick = (e) => {
    const b = e.target.closest('[data-wie]'); if (!b) return;
    wie = b.dataset.wie;
    $('wie').querySelectorAll('[data-wie]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  };
  $('fHeel').onclick = () => {
    heleDag = !heleDag;
    $('fHeel').setAttribute('aria-pressed', heleDag);
    $('fUren').hidden = heleDag;
  };
  function openNieuw(dag, voorWie, van, tot) {
    $('formNieuw').reset();
    $('fDatum').value = dag || (iso(new Date()) >= iso(maandag) && iso(new Date()) < iso(plusDagen(maandag, 7)) ? iso(new Date()) : iso(maandag));
    $('fVan').value = van || '09:00'; $('fTot').value = tot || '10:00';
    heleDag = false; $('fHeel').setAttribute('aria-pressed', 'false'); $('fUren').hidden = false;
    wie = voorWie || 'gezin';
    $('wie').querySelectorAll('[data-wie]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.wie === wie));
    $('fMelding').textContent = '';
    $('fBewaar').disabled = false;
    $('dlgNieuw').showModal();
    $('fTitel').focus();
  }
  $('nieuw').onclick = () => openNieuw(modus === 'dag' ? iso(dagSel) : undefined);
  $('fAnnuleer').onclick = () => $('dlgNieuw').close();
  $('formNieuw').onsubmit = async (e) => {
    e.preventDefault();
    const titel = $('fTitel').value.trim();
    if (!titel) { $('fMelding').textContent = 'Geef de afspraak een naam.'; return; }
    $('fBewaar').disabled = true;
    $('fMelding').textContent = 'Opslaan…';
    try {
      await hubDb.rpc('afspraak', {
        kal: wie, titel, datum: $('fDatum').value, heleDag,
        van: $('fVan').value, tot: $('fTot').value, locatie: $('fWaar').value.trim(),
      });
      $('dlgNieuw').close();
      dagSel = new Date($('fDatum').value + 'T12:00');
      maandag = maandagVan(dagSel);
      laad();
    } catch (err) {
      $('fBewaar').disabled = false;
      $('fMelding').textContent = err.code === 'not_granted'
        ? 'De sleutel ontbreekt op dit scherm.'
        : 'Opslaan lukte niet: ' + (err.message || 'probeer opnieuw');
    }
  };

  // Week wisselen
  function ga(n) {
    const oud = iso(maandag);
    if (modus === 'dag') { dagSel = plusDagen(dagSel, n); maandag = maandagVan(dagSel); }
    else { maandag = plusDagen(maandag, 7 * n); dagSel = new Date(maandag); dagSel.setHours(12, 0, 0, 0); }
    eersteKeer = true;
    if (iso(maandag) !== oud) { events = []; teken(); laad(); } else teken();
  }
  $('vorige').onclick = () => ga(-1);
  $('volgende').onclick = () => ga(1);
  $('nu').onclick = () => { dagSel = new Date(); dagSel.setHours(12, 0, 0, 0); maandag = maandagVan(dagSel); eersteKeer = true; laad(); };
  function zetModus(m) { modus = m; try { localStorage.setItem('hub.agenda.modus', m); } catch (e) {} eersteKeer = true; teken(); }
  $('wDag').onclick = () => zetModus('dag');
  $('wWeek').onclick = () => zetModus('week');
  // Nulijn elke minuut opschuiven
  setInterval(() => { if (modus === 'dag' && !document.querySelector('dialog[open]')) teken(); }, 60000);

  teken();
  laad();
  // Elke 5 minuten vernieuwen; om middernacht schuift "vandaag" mee.
  setInterval(() => {
    if (document.querySelector('dialog[open]')) return;
    const nuMaandag = maandagVan(new Date());
    if (iso(new Date()) === iso(nuMaandag) && new Date().getHours() === 0) maandag = nuMaandag;
    if (new Date().getHours() === 0 && new Date().getMinutes() < 5) { dagSel = new Date(); dagSel.setHours(12, 0, 0, 0); maandag = maandagVan(dagSel); }
    laad();
  }, 5 * 60000);
</script>
</body>
</html>
