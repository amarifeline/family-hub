<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pakjes</title>
<link rel="stylesheet" href="../shared/huisstijl.css">
<style>
  body { padding: var(--gutter); display: flex; flex-direction: column; min-height: 100vh; gap: 22px; }
  [hidden] { display: none !important; }
  .balk { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .titel { flex: 1; min-width: 200px; }
  .titel h1 { font-family: var(--script); font-weight: normal; font-size: clamp(48px, 6vw, 76px); margin: 0; line-height: 1; }
  .titel .label { margin-top: 18px; }
  .knop[disabled] { opacity: .5; }

  /* Twee blokken (af te halen, onderweg), elk pakje een rij */
  #groepen { display: flex; flex-direction: column; gap: 22px; flex: none; }
  .groep h2 { margin: 0 0 12px 4px; font-family: var(--serif); font-weight: normal; font-size: clamp(26px, 2.4vw, 34px); letter-spacing: 0; text-transform: none; color: var(--navy); display: flex; align-items: center; gap: 12px; }
  .groep h2 .aantal { font-family: var(--sans); font-size: 14px; font-weight: 500; min-width: 30px; height: 30px; padding: 0 9px; border-radius: 999px; background: var(--navy); color: var(--wit); display: inline-grid; place-items: center; }
  #groepen { gap: 34px !important; }
  .vink { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--lijn); background: var(--wit); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, border-color .2s; }
  .vink svg { width: 26px; height: 26px; stroke: var(--wit); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
  .vink:hover { border-color: var(--navy); }
  .pakje.af .vink { background: var(--navy); border-color: var(--navy); }
  .pakje.af .vink svg { opacity: 1; }
  .pakje { transition: opacity .3s; }
  .pakje.af { opacity: .45; }
  .stand .tot { color: var(--navy); font-weight: 500; }
  .lijst { list-style: none; margin: 0; padding: 0; background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--radius); overflow: hidden; flex: none; }
  .lijst:empty { display: none; }
  .pakje { display: flex; align-items: center; gap: 12px clamp(14px, 1.6vw, 24px); flex-wrap: wrap; padding: clamp(12px, 1.2vw, 18px) clamp(16px, 1.8vw, 28px); border-bottom: 1px solid var(--lijn); }
  .pakje:last-child { border-bottom: 0; }
  .pakje[data-st="klaar"] { box-shadow: inset 6px 0 0 var(--navy); }
  .pakje .ikoon { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--room); display: grid; place-items: center; }
  .pakje .ikoon svg { width: 30px; height: 30px; stroke: var(--navy); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .pakje[data-st="klaar"] .ikoon, .pakje[data-st="vandaag"] .ikoon { background: var(--navy); }
  .pakje[data-st="klaar"] .ikoon svg, .pakje[data-st="vandaag"] .ikoon svg { stroke: var(--wit); }
  .info { flex: 1 1 160px; min-width: 0; }
  .wat { font-family: var(--serif); font-size: clamp(20px, 1.6vw, 24px); line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
  .stand { font-family: var(--sans); font-size: 14px; color: var(--zacht); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; }
  .chip { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--room); border-radius: 999px; padding: 5px 12px; }
  .pakje[data-st="klaar"] .chip, .pakje[data-st="vandaag"] .chip { background: var(--navy); color: var(--wit); }
  .acties { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  .pakje .acties { flex: 0 0 auto; margin-left: auto; }
  .acties .vraag { font-family: var(--sans); font-size: 14px; }
  @media (max-width: 640px) { .pakje .ikoon { display: none; } .pakje .acties { flex-basis: 100%; justify-content: flex-start; margin-left: 62px; } }
  .leeg { font-family: var(--serif); font-size: clamp(22px, 2vw, 28px); color: var(--zacht); text-align: center; margin-top: 8vh; }
  .leeg small { display: block; font-family: var(--sans); font-size: 14px; margin-top: 14px; }
  .melding { font-family: var(--sans); font-size: 13px; text-align: center; min-height: 18px; color: var(--zacht); display: flex; gap: 12px; justify-content: center; align-items: center; }
  .melding button { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--navy); background: none; border: 0; text-decoration: underline; min-height: 44px; cursor: pointer; }
  .noot { font-family: var(--serif); font-size: 16px; color: var(--zacht); text-align: center; margin: 0; }

  dialog { border: 0; border-radius: var(--radius); padding: 28px; background: var(--wit); color: var(--navy); width: min(480px, 94vw); text-align: center; }
  dialog::backdrop { background: rgba(44, 62, 82, .35); }
  dialog h2 { font-family: var(--serif); font-weight: normal; font-size: 28px; margin: 0 0 6px; }
  .qr { width: min(300px, 70vw); margin: 18px auto 10px; }
  .qr svg { width: 100%; height: auto; display: block; }
  .qrtekst { font-family: var(--sans); font-size: 14px; color: var(--zacht); margin: 0 0 20px; }
  dialog .acties { justify-content: center; }
</style>
</head>
<body data-home="../" data-terug="5">
  <div class="balk">
    <a class="knop" href="../">Terug</a>
    <div class="titel">
      <h1>Pakjes</h1>
      <div class="label" id="sub">Even kijken in de mailbox…</div>
    </div>
    <button class="knop" id="vernieuw">Vernieuwen</button>
  </div>

  <main id="groepen"></main>
  <div class="leeg" id="leeg" hidden></div>
  <p class="noot" id="noot" hidden>Een pakje verdwijnt pas als een mail zegt dat het geleverd is, of als je het afvinkt. Amazon stuurt geen leveringsmail: vink die pakjes af als ze binnen zijn.</p>
  <div class="melding" id="melding"></div>

  <dialog id="dlg">
    <h2 id="dTitel"></h2>
    <div class="label" id="dSub"></div>
    <div class="qr" id="dQr"></div>
    <p class="qrtekst">Scan met je gsm om het pakje te volgen.</p>
    <div class="acties">
      <button class="knop" id="dOpen">Open op dit scherm</button>
      <button class="knop vol" id="dSluit">Sluiten</button>
    </div>
  </dialog>

<script src="../shared/config.js"></script>
<script src="../shared/hub-db.js"></script>
<script src="../shared/kiosk.js"></script>
<script src="../shared/qrcode.js"></script>
<script>
  // Pakjes: komt van de server (hubDb.rpc('pakjes')), die de bestel- en verzendmails in Gmail leest.
  // Wat we zelf als "ontvangen" aantikken, staat in pakjes/verborgen = { ids: { <id>: 'yyyy-mm-dd' } }.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const vandaag = () => iso(new Date());
  const morgen = () => { const d = new Date(); d.setDate(d.getDate() + 1); return iso(d); };
  const lang = (s) => new Date(s + 'T12:00:00').toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });

  const STATUS = { besteld: 'Besteld', verzonden: 'Onderweg', vandaag: 'Komt vandaag', klaar: 'Ligt klaar om af te halen' };
  const ICOON = {
    doos: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9M7.8 5.2l8.5 4.6"/>',
    winkel: '<path d="M4 9.5V20h16V9.5"/><path d="M3 9.5 4.5 4h15L21 9.5c0 1.4-1.1 2.5-2.5 2.5S16 10.9 16 9.5c0 1.4-1.1 2.5-2.5 2.5h-3C9.1 12 8 10.9 8 9.5 8 10.9 6.9 12 5.5 12S3 10.9 3 9.5Z"/><path d="M10 20v-5h4v5"/>',
    bon: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/>',
  };
  const CACHE = 'hub.pakjes';

  let db = null, data = null, verborgen = {}, bezig = false, openLink = null;

  function laatsteStand() {
    try { return JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (e) { return null; }
  }
  function bewaar(d) { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) { /* geen opslag */ } }

  function zichtbaar() { return data ? data.pakjes.filter((p) => !verborgen[p.id]) : []; }

  function wanneer(p) {
    if (p.status === 'klaar') {
      if (!p.tot) return '';
      if (p.tot < vandaag()) return 'ophaaltermijn verstreken (' + lang(p.tot) + ')';
      if (p.tot === vandaag()) return 'vandaag laatste dag om op te halen';
      if (p.tot === morgen()) return 'ophalen uiterlijk morgen';
      return 'ophalen tot ' + lang(p.tot);
    }
    if (!p.verwacht) return '';
    if (p.verwacht === vandaag()) return 'verwacht vandaag';
    if (p.verwacht === morgen()) return 'verwacht morgen';
    if (p.verwacht < vandaag()) return 'had er ' + lang(p.verwacht) + ' moeten zijn';
    return 'verwacht ' + lang(p.verwacht);
  }

  const VINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  function rijHtml(p) {
    const wat = p.wat || (p.ordernr ? 'Bestelling ' + p.ordernr : 'Bestelling');
    const knop = p.link ? `<button class="knop vol" data-a="volg">${p.volgen ? 'Volgen' : 'Bestelling bekijken'}</button>` : '';
    const ico = p.status === 'klaar' ? ICOON.winkel : p.status === 'besteld' ? ICOON.bon : ICOON.doos;
    const w = wanneer(p);
    return `<li class="pakje" data-st="${esc(p.status)}" data-id="${esc(p.id)}">
      <button class="vink" data-a="vink" aria-label="${p.status === 'klaar' ? 'Opgehaald' : 'Ontvangen'}: ${esc(wat)}">${VINK}</button>
      <div class="ikoon"><svg viewBox="0 0 24 24" aria-hidden="true">${ico}</svg></div>
      <div class="info"><div class="label">${esc(p.winkel)}</div><div class="wat">${esc(wat)}</div>
        <div class="stand"><span class="chip">${esc(STATUS[p.status] || p.status)}</span>${w ? `<span class="${p.status === 'klaar' ? 'tot' : ''}">${esc(w)}</span>` : ''}</div></div>
      ${knop ? `<div class="acties">${knop}</div>` : ''}
    </li>`;
  }

  function teken() {
    const host = $('groepen'), lijst = zichtbaar();
    $('leeg').hidden = !data || lijst.length > 0;
    $('noot').hidden = !lijst.length;
    if (data && !lijst.length) $('leeg').innerHTML = 'Er zijn geen pakjes onderweg.<small>We kijken in het label Bestellingen en in de bestel- en verzendmails van de laatste 30 dagen.</small>';
    const afhalen = lijst.filter((p) => p.status === 'klaar');
    const onderweg = lijst.filter((p) => p.status === 'verzonden' || p.status === 'vandaag');
    const besteld = lijst.filter((p) => p.status !== 'klaar' && p.status !== 'verzonden' && p.status !== 'vandaag');
    if (data) {
      const t = data.bijgewerkt ? new Date(data.bijgewerkt).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' }) : '';
      const delen = [];
      if (afhalen.length) delen.push(afhalen.length + ' af te halen');
      if (onderweg.length) delen.push(onderweg.length + ' onderweg');
      if (besteld.length) delen.push(besteld.length + ' besteld');
      $('sub').textContent = (delen.join(' · ') || 'Geen pakjes') + (t ? ' · bijgewerkt ' + t : '') + (data.proef ? ' · proefmodus' : '');
    }
    const groep = (titel, items) => items.length ? `<section class="groep"><h2>${titel}<span class="aantal">${items.length}</span></h2><ul class="lijst">${items.map(rijHtml).join('')}</ul></section>` : '';
    host.innerHTML = groep('Af te halen', afhalen) + groep('Onderweg', onderweg) + groep('Besteld', besteld);
    host.querySelectorAll('.pakje').forEach((el) => {
      const p = lijst.find((x) => x.id === el.dataset.id);
      const q = (a) => el.querySelector('[data-a="' + a + '"]');
      if (q('volg')) q('volg').onclick = () => toonVolgen(p);
      q('vink').onclick = () => { el.classList.add('af'); setTimeout(() => verberg(p), 450); };
    });
  }

  function melding(tekst, ongedaan) {
    const m = $('melding');
    m.innerHTML = '';
    if (!tekst) return;
    const s = document.createElement('span'); s.textContent = tekst; m.appendChild(s);
    if (ongedaan) { const b = document.createElement('button'); b.textContent = 'Ongedaan maken'; b.onclick = () => { ongedaan(); melding(''); }; m.appendChild(b); }
    clearTimeout(melding.t); melding.t = setTimeout(() => { m.innerHTML = ''; }, 8000);
  }

  async function bewaarVerborgen() {
    // Opruimen: wat al 60 dagen weg is, hoeft niet meer onthouden te worden.
    const grens = new Date(); grens.setDate(grens.getDate() - 60);
    Object.keys(verborgen).forEach((k) => { if (verborgen[k] < iso(grens)) delete verborgen[k]; });
    try { await db.doc('pakjes/verborgen').set({ ids: verborgen }); }
    catch (e) { melding('Niet bewaard: ' + (e.message || 'geen verbinding')); }
  }
  function verberg(p) {
    const id = p.id;
    verborgen[id] = vandaag(); teken(); bewaarVerborgen();
    melding((p.status === 'klaar' ? 'Opgehaald: ' : 'Ontvangen: ') + (p.wat || p.winkel) + '.', () => { delete verborgen[id]; teken(); bewaarVerborgen(); });
  }

  function toonVolgen(p) {
    openLink = p.link;
    $('dTitel').textContent = p.wat || (p.ordernr ? 'Bestelling ' + p.ordernr : p.winkel);
    $('dSub').textContent = p.winkel + (p.ordernr && p.wat ? ' · ' + p.ordernr : '');
    try {
      const qr = qrcode(0, 'M'); qr.addData(p.link); qr.make();
      $('dQr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
    } catch (e) { $('dQr').innerHTML = ''; }
    $('dlg').showModal();
  }
  $('dSluit').onclick = () => $('dlg').close();
  $('dOpen').onclick = () => {
    // Nieuw venster; het keukenscherm sluit het zelf na 3 minuten (er is daar geen knop om terug te gaan).
    const w = window.open(openLink, '_blank');
    if (w) { try { w.opener = null; } catch (e) { /* ok */ } setTimeout(() => { try { w.close(); } catch (e) { /* ok */ } }, 3 * 60000); }
    $('dlg').close();
  };

  async function laad(vers) {
    if (bezig) return;
    bezig = true; $('vernieuw').disabled = true;
    if (vers) $('sub').textContent = 'Even kijken in de mailbox…';
    try {
      data = await hubDb.rpc('pakjes', { vers: !!vers });
      bewaar(data); melding('');
    } catch (e) {
      const msg = String(e && e.message || '');
      if (/Onbekende opdracht/.test(msg)) melding('Het Apps Script kent pakjes nog niet. Zie README, stap "Pakjes uit Gmail".');
      else if (/toestemming|permission|authoriz|Gmail/i.test(msg)) melding('De hub mag Gmail nog niet lezen. Voer testPakjes één keer uit in Apps Script.');
      else melding('Kon de mailbox niet bekijken' + (msg ? ': ' + msg : '.'));
      if (!data) $('sub').textContent = 'Geen verbinding met de mailbox';
    } finally {
      bezig = false; $('vernieuw').disabled = false; teken();
    }
  }
  $('vernieuw').onclick = () => laad(true);

  (async () => {
    data = laatsteStand(); teken();
    db = await claude.use('db');
    db.doc('pakjes/verborgen').onSnapshot((s) => { verborgen = (s.exists && s.data().ids) ? Object.assign({}, s.data().ids) : {}; teken(); }, () => {});
    laad(false);
    setInterval(() => laad(false), 15 * 60000);
  })();
</script>
</body>
</html>
